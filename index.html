/* =====================================================================
   09 · ACCIONES — qué pasa cuando se toca un botón o se cambia un campo.
   Cada botón de la pantalla tiene un nombre (data-a) y su función acá.
   Si la acción devuelve SIN_GUARDAR, no se guarda ni se redibuja.
   ===================================================================== */
const SIN_GUARDAR = Symbol('sin-guardar');
const valorDe = id => document.getElementById(id).value;

/* Recupera los datos desde el texto de una copia (archivo elegido o texto pegado) */
async function restaurarDesdeTexto(texto) {
  if (S.demo) { aviso('En modo demo no se puede restaurar. Salí del modo demo en Ajustes.'); return false; }
  let datos;
  try {
    datos = JSON.parse(texto);
    if (!datos || !datos.items || !datos.spent) throw new Error('copia inválida');
  } catch (_) { aviso('Ese archivo no es una copia válida de Mi plata.'); return false; }
  if (!(await confirmar('Esto reemplaza los datos actuales por los de la copia. ¿Seguir?'))) return false;
  S = migrarEstado(datos);
  guardar(); dibujar(); aviso('Datos recuperados.');
  return true;
}

const ACCIONES = {
  /* --- gastos diarios --- */
  async anotar() {
    const monto = aNumero(valorDe('am'));
    if (!monto) return SIN_GUARDAR;
    const gasto = { date: valorDe('dt') || hoyISO(), amt: monto, note: valorDe('nt'), cat: UI.categoria || undefined };
    if (estaCerrado(S, gasto.date) && !(await confirmar('Ese día ya está cerrado. ¿Anotarlo igual?'))) return SIN_GUARDAR;
    if (UI.editando) {
      const existente = S.spent.find(e => e.id === UI.editando);
      if (existente) Object.assign(existente, gasto);
      UI.editando = null;
    } else S.spent.push({ id: Date.now(), ...gasto });
    UI.borrador = {}; UI.categoria = '';
  },
  categoria(el) {      // elegir o quitar la categoría sin perder lo que ya se escribió
    UI.borrador = { amt: valorDe('am'), note: valorDe('nt'), date: valorDe('dt') };
    UI.categoria = UI.categoria === el.dataset.v ? '' : el.dataset.v;
    dibujar(); return SIN_GUARDAR;
  },
  editar(el) {
    const gasto = S.spent.find(e => e.id === +el.dataset.i);
    UI.editando = +el.dataset.i; UI.borrador = {}; UI.categoria = (gasto && gasto.cat) || '';
    dibujar(); document.getElementById('am').focus(); return SIN_GUARDAR;
  },
  cancelarEdicion() { UI.editando = null; UI.borrador = {}; UI.categoria = ''; dibujar(); return SIN_GUARDAR; },
  async borrar(el) {
    const gasto = S.spent.find(x => x.id == el.dataset.i);
    if (gasto && estaCerrado(S, gasto.date) && !(await confirmar('Ese día ya está cerrado. ¿Borrarlo igual?'))) return SIN_GUARDAR;
    S.spent = S.spent.filter(x => x.id != el.dataset.i);
  },
  dictar() { dictarGasto(); return SIN_GUARDAR; },
  verTodos() { UI.verTodos = !UI.verTodos; dibujar(); return SIN_GUARDAR; },
  resumen() { ventanaResumen(); return SIN_GUARDAR; },
  recalibrar() {
    const c = calcular(S, hoyISO());
    S.objetivo = 0; S.objetivoDesde = '';                         // no pueden convivir con el objetivo
    S.recal = { day: c.hoyIdx, base: (c.disp - c.gastadoAntesDeHoy) / c.faltan };
  },
  quitarRecalibracion() { S.recal = null; S.objetivo = 0; S.objetivoDesde = ''; },

  /* --- gastos importantes --- */
  agregarGasto() {      // un gasto nuevo con el período empezado se descuenta desde hoy
    const hoy = hoyISO(), empezado = numeroDeDia(hoy) >= numeroDeDia(S.start);
    S.items.push({ n: '', a: 0, p: false, f: false, v: false,
      d: empezado ? isoDeNumero(Math.min(numeroDeDia(hoy), numeroDeDia(S.end) - 1)) : '' });
  },
  quitarGasto(el) { S.items.splice(+el.dataset.i, 1); },
  agregarProximo() { (S.proximos = S.proximos || []).push({ n: '', a: 0 }); },
  quitarProximo(el) { S.proximos.splice(+el.dataset.i, 1); },
  ponerCuotas(el) { S.items[+el.dataset.i].q = { actual: 1, total: 12 }; },
  quitarCuotas(el) { delete S.items[+el.dataset.i].q; },

  /* --- ingresos y primera introducción --- */
  agregarIngreso() { (S.ingresos = S.ingresos || []).push({ cat: CATEGORIAS_INGRESO[0], a: 0 }); },
  quitarIngreso(el) { S.ingresos.splice(+el.dataset.i, 1); },
  pasoSiguiente() {
    if (UI.paso === 3) {                                  // ingresos: hay que cargar al menos uno
      if (!(totalIngresos(S) > 0)) { aviso('Cargá al menos un ingreso para seguir.'); return SIN_GUARDAR; }
      if (numeroDeDia(S.end) <= numeroDeDia(S.start)) { aviso('Revisá las fechas del mes.'); return SIN_GUARDAR; }
    }
    if (UI.paso < 5) { UI.paso += 1; dibujar(); scrollTo(0, 0); return SIN_GUARDAR; }
    S.bienvenida = true; UI.paso = 0; UI.pestana = 'hoy'; scrollTo(0, 0);
  },
  pasoAtras() { UI.paso = Math.max(0, UI.paso - 1); dibujar(); scrollTo(0, 0); return SIN_GUARDAR; },
  verIntroduccion() { S.bienvenida = false; UI.paso = 0; scrollTo(0, 0); },

  /* --- cuentas y recomposiciones --- */
  agregarCuenta() { cuentasDe().push({ n: '', m: 0 }); },
  quitarCuenta(el) { cuentasDe().splice(+el.dataset.i, 1); },
  ajustarCuentas() {
    const cc = conciliar(S, calcular(S, hoyISO()));
    if (!cc.hayCuentas) { aviso('Cargá el saldo de una cuenta primero.'); return SIN_GUARDAR; }
    if (Math.abs(cc.diferencia) < 1) { aviso('Ya coincide.'); return SIN_GUARDAR; }
    UI.ajustePendiente = cc.diferencia; dibujar(); return SIN_GUARDAR;
  },
  ajusteNo() { UI.ajustePendiente = null; dibujar(); return SIN_GUARDAR; },
  ajusteSi() {
    const hoy = hoyISO();
    (S.ajustes = S.ajustes || []).push({ id: Date.now(), date: hoy, desde: mananaISO(hoy),
      amt: redondear2(UI.ajustePendiente), note: 'Recomposición' });
    UI.ajustePendiente = null; aviso('Recomposición anotada.');
  },
  async quitarRecomposicion(el) {
    if (!(await confirmar('¿Quitar esta recomposición?'))) return SIN_GUARDAR;
    S.ajustes.splice(+el.dataset.i, 1);
  },

  /* --- fondo de ahorro --- */
  usarFondo() { UI.usandoFondo = true; dibujar(); return SIN_GUARDAR; },
  cancelarUsoFondo() { UI.usandoFondo = false; dibujar(); return SIN_GUARDAR; },
  confirmarUsoFondo() {
    const monto = aNumero(valorDe('fu'));
    if (!monto) return SIN_GUARDAR;
    (S.fondoUsos = S.fondoUsos || []).push({ id: Date.now(), date: hoyISO(), amt: monto, note: valorDe('fn').trim(), para: valorDe('fp') === 'cubre' ? 'cubre' : 'hoy' });
    UI.usandoFondo = false; aviso('Listo: sacaste ' + pesos(monto) + ' del fondo.');
  },
  async quitarUsoFondo(el) {
    if (!(await confirmar('¿Quitar este retiro? El monto vuelve al fondo.'))) return SIN_GUARDAR;
    S.fondoUsos.splice(+el.dataset.i, 1);
  },

  /* --- metas --- */
  agregarMeta() { metasDe().push({ id: Date.now(), n: '', t: 0, g0: 0, f: '' }); },
  async quitarMeta(el) {
    if (!(await confirmar('¿Borrar la meta? Los aportes ya hechos quedan descontados de tu plata.'))) return SIN_GUARDAR;
    metasDe().splice(+el.dataset.i, 1);
  },
  aportar(el) {
    const meta = metasDe()[+el.dataset.i], monto = aNumero(valorDe('ap' + meta.id));
    if (!monto) return SIN_GUARDAR;
    S.spent.push({ id: Date.now(), date: hoyISO(), amt: monto, note: '🎯 ' + meta.n, meta: meta.id });
  },

  /* --- período, copias y exportaciones --- */
  async periodoNuevo() {
    const inicio = valorDe('nd1'), fin = valorDe('nd2');
    if (!inicio || !fin || numeroDeDia(fin) <= numeroDeDia(inicio)) { aviso('Revisá las fechas.'); return SIN_GUARDAR; }
    if (!(await confirmar('Se guarda el período actual en el historial y empieza uno nuevo. Los gastos importantes sin 🔁 se sacan; los de monto variable quedan vacíos. ¿Seguir?'))) return SIN_GUARDAR;
    const terminadas = iniciarPeriodo(S, hoyISO(), { previo: aNumero(valorDe('np')), inicio, fin });
    UI.pestana = 'hoy'; UI.editando = null;
    if (terminadas.length) aviso('Terminaste de pagar: ' + terminadas.join(', '));
  },
  async restaurarCierre(el) {
    const copia = (S.copias || [])[+el.dataset.i];
    if (!copia) return SIN_GUARDAR;
    if (!(await confirmar('Se restaura el estado al cierre del ' + diaYMes(copia.iso) + '. ¿Seguir?'))) return SIN_GUARDAR;
    const actual = S;
    S = migrarEstado(JSON.parse(copia.json));
    S.copias = actual.copias; S.cierres = actual.cierres;            // el historial y el PIN no se tocan
    S.pin = actual.pin; S.salt = actual.salt; S.pinApp = actual.pinApp;
  },
  csvDias() {
    const hoy = hoyISO(), c = calcular(S, hoy);
    descargar('dias.csv', csvDe([['Fecha', 'Día', 'Presupuesto del día', 'Gasto real', 'Sobrante']].concat(

/* Campos que se editan escribiendo: nombre del campo -> qué cambia */
const CAMBIOS = {
  nombre:        v => { if (S.demo) return; S.nombre = v.trim(); },
  objetivo:      v => {
    const antes = S.objetivo || 0;
    aplicarObjetivo(aNumero(v));
    if ((S.objetivo || 0) !== antes) aviso(S.objetivo > 0 ? 'Listo: tu límite de hoy ahora es ' + pesos(S.objetivo) + '.' : 'Volviste a tu límite normal.');
  },
  ocultar:       (v, el) => { S.ocultar = el.checked; UI.mostrarDinero = false; },
  recOn:         (v, el) => {
    S.recOn = el.checked;
    programarRecordatorio(true).then(r => {
      if (r === 'permiso') { S.recOn = false; guardar(); dibujar(); aviso('Falta el permiso de notificaciones: activalo en los ajustes del teléfono.'); }
      else if (r === false) aviso('No se pudo programar el recordatorio.');
      else if (S.recOn) aviso('Recordatorio activado a las ' + (S.recHora || '21:00') + '.');
    });
  },
  recHora:       v => { if (v) { S.recHora = v; if (S.recOn) programarRecordatorio(true); } },
  diasCopia:     v => { S.diasCopia = Math.max(0, Math.round(aNumero(v))); },
  previo:        v => { S.previo = aNumero(v); },
  modoFondo:     (v, el) => { S.modoFondo = el.checked; if (el.checked) S.fondoDesde = hoyISO(); UI.usandoFondo = false; },
  fondoExceso:   v => { S.fondoExceso = ['siguiente', 'fondo', 'aparte'].includes(v) ? v : 'siguiente'; },
  fondoPrev:     v => { S.fondoPrev = aNumero(v); },
  aviso:         v => { S.aviso = Math.min(100, Math.max(0, aNumero(v))); },
  inicio:        v => { if (v) S.start = v; },
  fin:           v => { if (v) S.end = v; },
  pinApp:        (v, el) => { S.pinApp = el.checked; },
  demoFrases:    (v, el) => { S.demoFrases = el.checked; },
  cuentaNombre:  (v, el, k) => { cuentasDe()[k].n = v; },
  cuentaSaldo:   (v, el, k) => { cuentasDe()[k].m = aNumero(v); },
  cuentaCuenta:  (v, el, k) => { cuentasDe()[k].x = !el.checked; },
  metaNombre:    (v, el, k) => { metasDe()[k].n = v; },
  metaObjetivo:  (v, el, k) => { metasDe()[k].t = aNumero(v); },
  metaPrevio:    (v, el, k) => { metasDe()[k].g0 = aNumero(v); },
  metaFecha:     (v, el, k) => { metasDe()[k].f = v; },
  itemNombre:    (v, el, k) => { S.items[k].n = v; },
  proxNombre:    (v, el, k) => { S.proximos[k].n = v; },
  proxMonto:     (v, el, k) => { S.proximos[k].a = aNumero(v); },
  itemMonto:     (v, el, k) => {
    /* Con el período ya empezado, lo nuevo (un monto recién cargado o un aumento) se descuenta
       desde hoy, repartido entre los días que faltan; lo que ya estaba no se toca. */
    const it = S.items[k], antes = montoDe(it), nuevo = aNumero(v), hoy = hoyISO();
    if (numeroDeDia(hoy) >= numeroDeDia(S.start) && nuevo !== antes) {
      const desde = isoDeNumero(Math.min(numeroDeDia(hoy), numeroDeDia(S.end) - 1));
      if (antes === 0) { it.d = desde; delete it.x; }
      else if (nuevo > antes) (it.x = it.x || []).push({ amt: redondear2(nuevo - antes), desde });
      else {                                           // baja: primero se sacan los aumentos más nuevos
        let baja = antes - nuevo;
        while (baja > 0 && it.x && it.x.length) {
          const u = it.x[it.x.length - 1];
          if (u.amt > baja) { u.amt = redondear2(u.amt - baja); baja = 0; } else { baja -= u.amt; it.x.pop(); }
        }
        if (it.x && !it.x.length) delete it.x;
      }
    }
    it.a = nuevo;
  },
  itemPagado:    (v, el, k) => { S.items[k].p = el.checked; },
  itemRepite:    (v, el, k) => { S.items[k].f = el.checked; if (!el.checked) S.items[k].v = false; },
  itemVariable:  (v, el, k) => { S.items[k].v = el.checked; },
  ingresoCategoria: (v, el, k) => { S.ingresos[k].cat = v; },
  ingresoMonto:  (v, el, k) => { S.ingresos[k].a = aNumero(v); },
  cuotaActual:   (v, el, k) => { const q = S.items[k].q; q.actual = Math.max(1, Math.round(aNumero(v))); if (q.actual > q.total) q.total = q.actual; },
  cuotaTotal:    (v, el, k) => {
    const gasto = S.items[k], total = Math.round(aNumero(v));
    if (total <= 1) delete gasto.q; else { gasto.q.total = total; if (gasto.q.actual > total) gasto.q.actual = total; }
  },
};

/* --- despacho: el único lugar donde se ejecutan las acciones --- */
async function alHacerClic(e) {
  const fila = e.target.closest('.tb[data-d]');
  if (fila) { ventanaDia(fila.dataset.d); return; }
  const accion = e.target.dataset.a;
  if (accion) await ejecutar(accion, e.target, false);
}
async function ejecutar(accion, elemento, autorizado) {
  if (S.demo && BLOQUEADAS_EN_DEMO.includes(accion)) { aviso('En modo demo no se puede hacer eso. Salí del modo demo en Ajustes.'); return; }
  if (ACCIONES_PROTEGIDAS.includes(accion) && S.pin && !autorizado) {       // pide PIN y reintenta
    if (!(await pedirPin('Continuar'))) return;
    return ejecutar(accion, elemento, true);
  }
  const hacer = ACCIONES[accion];
  if (!hacer) return;
  if (await hacer(elemento) === SIN_GUARDAR) return;
  guardar(); dibujar();
  if (accion === 'anotar') alertaDeLimite();
}
function alertaDeLimite() {
  const [clase, mensaje] = semaforo(calcular(S, hoyISO()), S);
  if (!clase) return;
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (_) {}
  pitido(); aviso(mensaje);
}
function alHacerCambio(e) {
  const el = e.target;
  if (el.id === 'ph') { if (el.files[0]) leerTicket(el.files[0]); return; }
  if (el.id === 'fi') {                       // se eligió un archivo de copia (por ejemplo desde Drive)
    const archivo = el.files[0];
    if (archivo) {
      const lector = new FileReader();
      lector.onload = () => { restaurarDesdeTexto(lector.result); el.value = ''; };
      lector.readAsText(archivo);
    }
    return;
  }
  const campo = el.dataset.f;
  if (!campo || !CAMBIOS[campo]) return;
  CAMBIOS[campo](el.value, el, el.dataset.k);
  guardar(); dibujar();
}

/* El objetivo pasa a ser el límite diario oficial desde hoy. Se apoya en la recalibración (S.recal):
   desde hoy cada día vale `base` = objetivo, y lo que no se gaste se arrastra al día siguiente.
   La marca `obj: true` permite sacarla al borrar el objetivo sin tocar una recalibración hecha a mano. */
function aplicarObjetivo(valor) {
  const n = Math.max(0, Math.round(+valor || 0)), hoy = hoyISO(), c = calcular(S, hoy);
  if (n > 0 && n === S.objetivo && S.recal && S.recal.obj) return;          // mismo número: no se reinicia nada
  S.objetivo = n;
  if (n > 0) { S.objetivoDesde = hoy; S.recal = { day: c.hoyIdx, base: n, obj: true }; }
  else { S.objetivoDesde = ''; if (S.recal && S.recal.obj) S.recal = null; }
}

/* =====================================================================
   DEMO AUTOMÁTICA — escribe sola los datos de ejemplo para grabar la pantalla.
   Solo anda en modo demo. Tocar 3 veces la pantalla la corta.
   ===================================================================== */
let demoCorriendo = false, demoCancelada = false, demoRitmo = 1;     // demoRitmo: 1 = velocidad normal
const DEMO_CORTADA = 'demo-cortada';
async function pausaDemo(ms) {
  const fin = Date.now() + ms * demoRitmo;
  while (Date.now() < fin) {
    if (demoCancelada) throw new Error(DEMO_CORTADA);
    await new Promise(r => setTimeout(r, Math.max(0, Math.min(100, fin - Date.now()))));
  }
  if (demoCancelada) throw new Error(DEMO_CORTADA);
}
const buscarDemo = sel => document.querySelector(sel);
function demoFrase(texto) {
  let f = document.getElementById('demo-frase');
  if (!texto || S.demoFrases === false) { if (f) f.classList.remove('on'); return; }
  if (!f) { f = document.createElement('div'); f.id = 'demo-frase'; document.body.appendChild(f); }
  f.textContent = texto; f.classList.add('on');
}
function demoCapa(encender) {
  let c = document.getElementById('demo-capa');
  if (!encender) { if (c) c.remove(); return; }
  if (c) return;
  c = document.createElement('div'); c.id = 'demo-capa';
  let toques = [];
  c.addEventListener('click', () => {                       // 3 toques seguidos cortan la demo
    const t = Date.now(); toques = toques.filter(x => t - x < 1200).concat(t);
    if (toques.length >= 3) demoCancelada = true;
  });
  document.body.appendChild(c);
}
function demoToque(el) {
  if (!el || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect(), t = document.createElement('div');
  t.className = 'demo-toque'; t.style.left = (r.left + r.width / 2) + 'px'; t.style.top = (r.top + r.height / 2) + 'px';
  document.body.appendChild(t); setTimeout(() => t.remove(), 800);
}
async function demoTocar(el) {
  if (!el) return;
  if (el.getBoundingClientRect && el.scrollIntoView && !(el.closest && el.closest('.pie, nav'))) {   // si está fuera de vista, se desplaza hasta ahí
    const r = el.getBoundingClientRect(), alto = typeof innerHeight === 'number' ? innerHeight : 800;
    if (r.top < 110 || r.bottom > alto - 140) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); await pausaDemo(700); }
  }
  demoToque(el); await pausaDemo(450); el.click(); await pausaDemo(350);
}
function demoConfirmar(el) { if (el && el.dispatchEvent) el.dispatchEvent(new Event('change', { bubbles: true })); }   // como al salir del campo
/* Cursor que parpadea al final de lo escrito (el teclado de Android no se abre, así que se dibuja uno) */
function demoCursor(el, texto) {
  let c = document.getElementById('demo-cursor');
  if (!el || !el.getBoundingClientRect) { if (c) c.remove(); return; }
  if (!c) { c = document.createElement('div'); c.id = 'demo-cursor'; document.body.appendChild(c); }
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  let ancho = 0;
  try {
    const g = (demoCursor.lienzo || (demoCursor.lienzo = document.createElement('canvas'))).getContext('2d');
    g.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    ancho = g.measureText(texto || '').width;
  } catch (_) {}
  const alto = (parseFloat(cs.fontSize) || 16) * 1.3;
  c.style.left = (r.left + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.borderLeftWidth) || 0) + ancho) + 'px';
  c.style.top = (r.top + r.height / 2 - alto / 2) + 'px';
  c.style.height = alto + 'px';
  c.style.background = cs.color || '#000';
}
async function demoEscribir(el, texto, ms, espera) {
  if (!el) return;
  el.value = '';
  try {
    demoCursor(el, '');
    await pausaDemo(espera || 600);                            // el cursor parpadea un momento antes de escribir
    for (const letra of texto) { el.value += letra; demoCursor(el, el.value); await pausaDemo(ms || 130); }
    await pausaDemo(400);
  } finally { demoCursor(null); }
}
async function demoCuenta() {
  const c = document.createElement('div'); c.id = 'demo-cuenta'; document.body.appendChild(c);
  try {
    for (let n = 5; n >= 1; n--) {
      c.innerHTML = '<div class="demo-aviso">Empezá a grabar la pantalla</div><div class="demo-num">' + n + '</div>' +
        '<div class="demo-aviso" style="font-size:14px;font-weight:400">Para cortar: tocá 3 veces la pantalla</div>';
      await pausaDemo(1000);
    }
  } finally { c.remove(); }
}

    const exceso = Math.max(1000, Math.round((cB.quedaHoy + (cB.baseManana || 0) * 0.75) / 1000) * 1000);   // deja a mañana con poco
    const tarjetaB = buscarDemo('#tarjeta-anotar');
    if (tarjetaB && tarjetaB.scrollIntoView) tarjetaB.scrollIntoView({ behavior: 'smooth', block: 'center' });
    await pausaDemo(1000);
    await demoTocar(buscarDemo('#am')); await demoEscribir(buscarDemo('#am'), String(exceso), 150);
    await demoTocar(buscarDemo('#nt')); await demoEscribir(buscarDemo('#nt'), 'Cena', 110);
    await demoTocar(buscarDemo('button[data-a="categoria"][data-v="Salidas"]'));
    await pausaDemo(500);
    await demoTocar(buscarDemo('#tarjeta-anotar button[data-a="anotar"]'));
    await pausaDemo(600);
    ajustarCuentasDemo(); guardar(); dibujar();
    const gastoExtra = S.spent[S.spent.length - 1], idExceso = gastoExtra && gastoExtra.id;
    await resaltarManana(6000);

    demoFrase('Elijo cuánto gastar por día y veo cuánto ahorro');
    await demoTocar(buscarDemo('nav button[data-t="dias"]'));
    if (idExceso) { S.spent = S.spent.filter(x => x.id !== idExceso); ajustarCuentasDemo(); guardar(); dibujar(); }   // vuelve a los números de antes
    await pausaDemo(800);
    const campo = buscarDemo('input[data-f="objetivo"]');
    await demoTocar(campo); await demoEscribir(campo, '12000', 160);
    await pausaDemo(400);
    if (campo) campo.dispatchEvent(new Event('change', { bubbles: true }));
    await pausaDemo(5000);

    demoFrase('Gratis 👉 link en mi bio');
    await demoTocar(buscarDemo('nav button[data-t="hoy"]'));
    await pausaDemo(4000);
  } catch (e) {
    if (!(e && e.message === DEMO_CORTADA)) console.error(e);
  } finally {
    const cortada = demoCancelada;
    demoFrase(''); demoCapa(false); demoCursor(null);
    const cuenta = document.getElementById('demo-cuenta'); if (cuenta) cuenta.remove();
    demoCorriendo = false; demoCancelada = false;
    S.bienvenida = true; UI.paso = 0; UI.pestana = 'hoy'; dibujar();
    if (cortada) aviso('Demo cortada.');
  }
}

/* Con el teclado abierto: se esconde la barra de abajo y, si se escribe en "Anotar gasto", la tarjeta
   entera se lleva a la vista (monto, detalle, categorías, fecha y botón azul juntos, sobre el teclado). */
(function () {
  const esCampo = el => !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  let temporizador = null;
  document.addEventListener('focusin', e => {
    if (!esCampo(e.target)) return;
    clearTimeout(temporizador);
    document.body.classList.add('teclado');
    const tarjeta = e.target.closest && e.target.closest('#tarjeta-anotar');
    if (tarjeta) [350, 800].forEach(demora => setTimeout(() => {   // dos intentos: el teclado tarda en abrirse
      if (document.body.contains(tarjeta) && tarjeta.contains(document.activeElement)) tarjeta.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }, demora));
  });
  document.addEventListener('focusout', () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { if (!esCampo(document.activeElement)) document.body.classList.remove('teclado'); }, 300);
  });
  /* Si la pantalla se vuelve a dibujar con un campo enfocado (por ejemplo al confirmar un número con Enter),
     el campo desaparece sin avisar: se revisa después de cada dibujo para que la barra de abajo no quede escondida. */
  new MutationObserver(() => { if (!esCampo(document.activeElement)) document.body.classList.remove('teclado'); })
    .observe(document.getElementById('m'), { childList: true });
})();

/* Lo llama la app de Android cuando se toca el "+" del widget (se ignora si ya se atendió ese pedido) */
window.miplataAbrir = (accion, id) => {
  if (id && window.__abrirId === id) return;
  if (accion === 'anotar') { abrirAnotarGasto(); window.__abrirId = id; }
};

/* =====================================================================
   10 · ARRANQUE — conecta todo y pone la app en marcha.
   ===================================================================== */
function cerrarDias(incluirHoy) {
  if (congelarDias(S, hoyISO(), incluirHoy)) guardar();
}
function programarCierreNocturno() {      // 23:59:30 de cada día, si la app está abierta
  const ahora = new Date();
  let falta = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate(), 23, 59, 30) - ahora;
  if (falta <= 0) falta += MS_DIA;
  setTimeout(() => { cerrarDias(true); dibujar(); programarCierreNocturno(); }, falta);
}

function iniciar() {
  const principal = document.getElementById('m');
  document.querySelector('nav').onclick = e => {
    const pestana = e.target.dataset.t;
    if (pestana) { UI.pestana = pestana; dibujar(); scrollTo(0, 0); }
  };
  document.getElementById('fab').onclick = abrirAnotarGasto;
  principal.onclick = alHacerClic;
  principal.onchange = alHacerCambio;
  principal.onkeydown = e => {
    if (e.key === 'Enter' && e.target.id === 'pin') desbloquear();
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f === 'objetivo') e.target.blur();   // confirma el objetivo
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => dibujar());
  ['click', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, reiniciarInactividad, { passive: true }));
  document.addEventListener('visibilitychange', alCambiarVisibilidad);

  dibujar();
  if (S.demo) aviso('Modo demo activo: son datos de ejemplo. Salí desde Ajustes.');
  if (S.recOn) programarRecordatorio(false);
  actualizarWidgetResumen();
  iniciarNube().then(() => cerrarDias());
  programarCierreNocturno();
  reiniciarInactividad();
  if (CONFIG.sw && 'serviceWorker' in navigator)
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
iniciar();
