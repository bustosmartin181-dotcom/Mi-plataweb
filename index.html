<style>
:root {

  --acx: #FFFFFF;
  --ok: #1B6B4A;
  --warn: #B86E1E;
  --bad: #C23B3B;
  --bd: #E5DFD6;

  --radius-sm: 12px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Outfit', system-ui, sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614;
    --bg-soft: #1C221F;
    --card: #1A211D;
    --tx: #F0F2F0;
    --mut: #9AA59D;
    --ac: #3D9B6E;
    --ac-soft: #1E3328;
    --acx: #0A120E;
    --ok: #3D9B6E;
    --warn: #E09A3E;
    --bad: #E86A6A;
    --bd: #2A332E;
    --shadow: 0 4px 24px rgba(0,0,0,0.25);
  }
}
:root[data-theme="dark"] {
  --bg: #121614;
  --bg-soft: #1C221F;
  --card: #1A211D;
  --tx: #F0F2F0;
  --mut: #9AA59D;
  --ac: #3D9B6E;
  --ac-soft: #1E3328;
  --acx: #0A120E;
  --ok: #3D9B6E;
  --warn: #E09A3E;
  --bad: #E86A6A;
  --bd: #2A332E;
  --shadow: 0 4px 24px rgba(0,0,0,0.25);
}
:root[data-theme="light"] {
  --bg: #F5F1EB;
  --bg-soft: #EDE8E0;
  --card: #FFFFFF;
  --tx: #1A1F1C;
  --mut: #6B756F;
  --ac: #1B6B4A;
  --ac-soft: #E6F2EC;
  --acx: #FFFFFF;
  --ok: #1B6B4A;
  --warn: #B86E1E;
  --bad: #C23B3B;
  --bd: #E5DFD6;
  --shadow: 0 4px 24px rgba(26, 31, 28, 0.06), 0 1px 3px rgba(26, 31, 28, 0.04);

html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
* { box-sizing: border-box; }
body {

}
body::before {
  content: '';

  inset: 0;
  background:

  pointer-events: none;
  z-index: 0;
}
main {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  padding: 20px 20px 100px;
}
.card {
  background: var(--card);

}
.mut { color: var(--mut); font-size: 0.9375rem; }
.num {

  margin: 6px 0 10px;
}
.num.neg { color: var(--bad); }
.num-ok { color: var(--ok); }
.num.warn { color: var(--warn); }
.neg { color: var(--bad); }
.warn { color: var(--warn); }
.toast {

}
.row {

}

input, select {
  font-family: var(--font-body);
  font-size: 1rem;

  background: var(--bg);
  border: 1.5px solid var(--bd);
  border-radius: var(--radius-sm);
  padding: 12px 14px;

}
input:focus, select:focus { border-color: var(--ac); }

textarea {

button {

/* ===== Barra flotante de vidrio y botón "＋" (inspirado en el estilo de One UI 8.5) ===== */
:root { --glass: rgba(255, 255, 255, 0.74); }

:root { --radius: 22px; }

<main id="m"></main>
<nav><button data-t="plan">Plan</button><button data-t="hoy">Hoy</button><button data-t="dias">Días</button><button data-t="ajustes">Ajustes</button></nav>

<script>
const CONFIG = {"nube": false, "claude": false, "sw": false, "apk": true};
/* =====================================================================
   01 · UTILIDADES — formatos, fechas y texto. No dependen de la pantalla.
   ===================================================================== */
const MS_DIA = 864e5;
const NOMBRES_DIA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

const dosDigitos = n => String(n).padStart(2, '0');
const suma = (lista, valor) => lista.reduce((total, x) => total + valor(x), 0);

/* Dinero */
const pesos = n =>
  (Math.round(n) < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('es-AR');
const pesosConCentavos = n =>
  (n < 0 ? '-' : '') + '$' +
  Math.abs(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const redondear2 = n => Math.round(n * 100) / 100;

/* Lee un monto escrito a mano: "3.500,50" -> 3500.5 */
const aNumero = v =>
  +String(v).replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '') || 0;

/* Texto seguro para insertar en HTML */
const escapar = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Fechas: se manejan como texto "AAAA-MM-DD" y como número de día (sin horas) */
function numeroDeDia(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return Date.UTC(a, m - 1, d) / MS_DIA;
}
const isoDeNumero = n => new Date(n * MS_DIA).toISOString().slice(0, 10);
function hoyISO() {
  const d = new Date();
  return d.getFullYear() + '-' + dosDigitos(d.getMonth() + 1) + '-' + dosDigitos(d.getDate());
}
function mesSiguiente(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(a, m, d)).toISOString().slice(0, 10);
}
const diaYMes = iso => iso.slice(8) + '/' + iso.slice(5, 7);
const mananaISO = hoy => isoDeNumero(numeroDeDia(hoy) + 1);

/* =====================================================================
   02 · NÚCLEO — las reglas del dinero. Funciones puras: reciben el estado
   y la fecha de hoy, y devuelven números. No tocan la pantalla.
   Esto es lo que verifican los tests.
   ===================================================================== */

const montoDe = item => +item.a || 0;

/* Estado vacío para empezar de cero */
function estadoInicial(hoy) {
  return {
    sueldo: 0, previo: 0, bienvenida: false, ingresos: [{ cat: 'Sueldo', a: 0 }],
    start: hoy, end: mesSiguiente(hoy),
    items: [{ n: '', a: 0, p: false }, { n: '', a: 0, p: false }, { n: '', a: 0, p: false }],
    spent: [], recal: null,
  };
}

/* Modo demo: datos de ejemplo para grabar videos o sacar capturas sin mostrar la plata real.
   Los datos reales se guardan aparte (CLAVE_REAL) y vuelven al salir del modo demo. */
function estadoDemo(real) {
  const hoy = hoyISO(), n = numeroDeDia(hoy), start = isoDeNumero(n - 11);
  const D = {
    demo: true, bienvenida: true, nombre: 'Martín',
    sueldo: 620000, previo: 0, ingresos: [{ cat: 'Sueldo', a: 620000 }],
    start, end: mesSiguiente(start),
    items: [
      { n: 'Alquiler', a: 180000, p: true }, { n: 'Luz', a: 25000, p: true }, { n: 'Internet', a: 20000, p: true },
    ],
    spent: [], recal: null,
    metas: [{ id: 1, n: 'Vacaciones', t: 300000, g0: 60000, f: '' }],
    ultimaCopia: Date.now(),
  };
  ['tema', 'color', 'pin', 'salt', 'pinApp'].forEach(k => { if (real[k] !== undefined) D[k] = real[k]; });
  const gastos = [
    [-11, 12500, 'Supermercado', 'Súper'], [-10, 13500, 'Cena con amigos', 'Salidas'],
    [-9, 2500, 'SUBE', 'Transporte'], [-9, 9300, 'Almuerzo', 'Comida'],
    [-8, 15200, 'Supermercado', 'Súper'], [-7, 8400, 'Delivery', 'Comida'], [-7, 3100, 'Kiosco', 'Otro'],
    [-6, 7100, 'Farmacia', 'Salud'], [-6, 6000, 'Nafta', 'Transporte'],
    [-5, 8800, 'Almuerzo', 'Comida'], [-5, 2900, 'Café', 'Comida'],
    [-4, 14400, 'Supermercado', 'Súper'], [-3, 3000, 'SUBE', 'Transporte'], [-3, 8900, 'Panadería y almuerzo', 'Comida'],
    [-2, 11200, 'Cine', 'Salidas'], [-1, 9400, 'Almuerzo y café', 'Comida'],
  ];
  gastos.forEach(([d, amt, note, cat], i) => D.spent.push({ id: Date.now() + i, date: isoDeNumero(n + d), amt, note, cat }));
  return D;
}

/* Reparte el saldo entre las cuentas de ejemplo para que coincidan con lo que dice la app */
function ajustarCuentasDemo() {
  const saldo = Math.round(calcular(S, hoyISO()).saldo), banco = Math.round(saldo * 0.6), mp = Math.round(saldo * 0.3);
  S.cuentas = [{ n: 'Banco', m: banco }, { n: 'Mercado Pago', m: mp }, { n: 'Efectivo', m: saldo - banco - mp }];
}

/* Todos los números del período para el día `hoy`.
   - Un gasto importante con fecha `d` y las recomposiciones se descuentan
     desde su fecha, repartidos entre los días que faltan.
   - Lo que se aparta para una meta (gasto con `meta`) sale de la plata
     disponible, no del presupuesto de un día. */
function calcular(S, hoy) {
  const total        = suma(S.items, montoDe);
  /* Un aumento de monto en un gasto ya cargado (i.x = [{ amt, desde }]) se descuenta
     desde su fecha, no desde el primer día del período. */
  const aumentosDe   = i => i.x || [];
  const montoBase    = i => montoDe(i) - suma(aumentosDe(i), x => +x.amt || 0);
  const totalBase    = suma(S.items.filter(i => !i.d), montoBase);
  const porPagar     = suma(S.items.filter(i => !i.p), montoDe);
  const descuentos   = (S.ajustes || []).concat(
    S.items.filter(i => i.d).map(i => ({ amt: -montoBase(i), desde: i.d })),
    S.items.reduce((l, i) => l.concat(aumentosDe(i).map(x => ({ amt: -(+x.amt || 0), desde: x.desde }))), []));
  const aportes      = suma(S.spent.filter(e => e.meta), e => e.amt);
  const dispBase     = (+S.sueldo || 0) + (+S.previo || 0) - totalBase - aportes;
  const disp         = dispBase + suma(descuentos, x => x.amt);

  const dias    = Math.max(1, numeroDeDia(S.end) - numeroDeDia(S.start));
  const hoyIdx  = Math.min(Math.max(numeroDeDia(hoy) - numeroDeDia(S.start), 0), dias - 1);
  const base    = dispBase / dias;
  const recal   = (S.recal && S.recal.day <= hoyIdx) ? S.recal : null;
  const desde   = recal ? recal.day : 0;

  /* descuento diario (negativo) que corresponde al día i */
  const extra = i => suma(descuentos, x => {
    const d0 = x.desde ? Math.max(0, numeroDeDia(x.desde) - numeroDeDia(S.start)) : 0;
    return i >= d0 ? x.amt / Math.max(1, dias - d0) : 0;
  });
  const presupuestoDia = i => (recal && i >= recal.day) ? recal.base : base + extra(i);

  const idxDe     = e => numeroDeDia(e.date) - numeroDeDia(S.start);
  const gastado   = (a, b) =>
    suma(S.spent.filter(e => !e.meta && idxDe(e) >= a && idxDe(e) <= b), e => e.amt);
  const gastoHoy  = gastado(hoyIdx, hoyIdx);

  let acumulado = 0;
  for (let i = desde; i <= hoyIdx; i++) acumulado += presupuestoDia(i);
  const quedaHoy = acumulado - gastado(desde, hoyIdx);
  const hayManana = hoyIdx < dias - 1;
  const saldoPeriodo = disp - suma(S.spent.filter(e => !e.meta), e => e.amt);

  /* MODO FONDO: lo que no se gasta de cada día NO pasa al día siguiente: va a un fondo aparte.
     Cada día arranca con su base. Si te pasás, depende de S.fondoExceso:
       'siguiente' (por defecto): lo que te pasaste se descuenta del día siguiente.
       'fondo': lo que te pasaste se descuenta del fondo.
       'aparte': no se descuenta de ningún lado. */
  const modoFondo = !!S.modoFondo, regla = S.fondoExceso === 'aparte' ? 'aparte' : 'siguiente';
  let filas = null, fondo = { activo: false }, quedaHoyF = quedaHoy, mananaF = null;
  if (modoFondo) {
    /* El fondo cuenta desde el día en que se activó (S.fondoDesde). Los días anteriores se calculan
       como siempre (lo que sobra pasa al día siguiente) y no aportan al fondo: así, al activarlo,
       lo que ya tenés hoy no cambia, y desde esta noche lo que no gastes del día va al fondo. */
    const iniFondo = S.fondoDesde ? Math.min(Math.max(numeroDeDia(S.fondoDesde) - numeroDeDia(S.start), 0), dias - 1) : 0;
    /* Retiros del fondo marcados "para gastar" (para:'hoy'): suman al presupuesto del día en que se sacaron.
       Si ese día no se gastan, al cierre vuelven solos al fondo (porque sobran). */
    const extraRetiro = {};
    (S.fondoUsos || []).forEach(x => {
      if (x.para === 'cubre') return;
      const k = Math.min(Math.max(numeroDeDia(x.date) - numeroDeDia(S.start), 0), dias - 1);
      extraRetiro[k] = (extraRetiro[k] || 0) + (+x.amt || 0);
    });
    filas = []; let arrastre = 0;
    for (let i = 0; i < dias; i++) {
      if (recal && i === recal.day) arrastre = 0;
      const sin = presupuestoDia(i) + (extraRetiro[i] || 0);
      const presupuesto = i <= hoyIdx + 1 ? sin + arrastre : sin;
      const gasto = gastado(i, i);
      const sobra = presupuesto - gasto;
      const previo = i < iniFondo;
      filas.push({ i, presupuesto, gasto, sobra, aporte: previo ? 0 : (regla === 'fondo' ? sobra : Math.max(0, sobra)) });
      arrastre = previo ? sobra : (regla === 'siguiente' ? Math.min(0, sobra) : 0);
    }
    const cerrados = Math.min(dias, Math.max(0, numeroDeDia(hoy) - numeroDeDia(S.start)));
    const ahorroPeriodo = suma(filas.slice(0, cerrados), f => f.aporte);
    const usos = suma(S.fondoUsos || [], x => +x.amt || 0), previo = +S.fondoPrev || 0;
    const usosParaGastar = suma((S.fondoUsos || []).filter(x => x.para !== 'cubre'), x => +x.amt || 0);
    quedaHoyF = filas[hoyIdx].presupuesto - filas[hoyIdx].gasto;
    mananaF = hayManana ? presupuestoDia(hoyIdx + 1) + (regla === 'siguiente' ? Math.min(0, quedaHoyF) : 0) : null;
    fondo = {
      activo: true, regla, fondoPrev: previo, ahorroPeriodo, usos,
      total: previo + ahorroPeriodo - usos,
      acumulado: previo + (+S.fondoRetirado || 0) + ahorroPeriodo,     // lo ahorrado en total: nunca baja
      hoySuma: regla === 'fondo' ? quedaHoyF : Math.max(0, quedaHoyF),
      disponible: saldoPeriodo - ahorroPeriodo + usosParaGastar,   // lo retirado para gastar pasa a disponible
    };
  }

  return {
    total, porPagar, disp, dias, hoyIdx, base, recal, extra, presupuestoDia,
    baseHoy: presupuestoDia(hoyIdx),
    baseManana: hayManana ? presupuestoDia(hoyIdx + 1) : null,
    manana: modoFondo ? mananaF : (hayManana ? presupuestoDia(hoyIdx + 1) + quedaHoy : null),
    gastoHoy, quedaHoy: modoFondo ? quedaHoyF : quedaHoy, filas, fondo,
    faltan: dias - hoyIdx,
    saldo: disp - suma(S.spent.filter(e => !e.meta), e => e.amt),
    gastadoAntesDeHoy: gastado(-1e9, hoyIdx - 1),
  };
}

/* Tabla día por día: presupuesto (con lo que arrastra), gasto y sobrante */
function diasDelPeriodo(S, hoy) {
  const c = calcular(S, hoy), salida = [];
  if (c.fondo.activo) return c.filas.map(f => {
    const n = numeroDeDia(S.start) + f.i;
    return { i: f.i, iso: isoDeNumero(n), dia: NOMBRES_DIA[new Date(n * MS_DIA).getUTCDay()],
             presupuesto: f.presupuesto, gasto: f.gasto, sobra: f.sobra };
  });
  let arrastre = 0;
  for (let i = 0; i < c.dias; i++) {
    if (c.recal && i === c.recal.day) arrastre = 0;
    const sinArrastre = (c.recal && i >= c.recal.day) ? c.recal.base : c.base + c.extra(i);
    const presupuesto = i <= c.hoyIdx + 1 ? sinArrastre + arrastre : sinArrastre;
    const n = numeroDeDia(S.start) + i, iso = isoDeNumero(n);
    const gasto = suma(S.spent.filter(e => e.date === iso && !e.meta), e => e.amt);
    const sobra = presupuesto - gasto;
    arrastre = sobra;
    salida.push({ i, iso, dia: NOMBRES_DIA[new Date(n * MS_DIA).getUTCDay()],
                  presupuesto, gasto, sobra });
  }
  return salida;
}

/* Semáforo del día: [clase, mensaje] */
function semaforo(c, S) {
  const presupuesto = c.quedaHoy + c.gastoHoy, umbral = (S.aviso ?? 20) / 100;
  if (c.quedaHoy < 0) return ['neg', 'Te pasaste del límite de hoy.'];
  if (presupuesto > 0 && c.quedaHoy <= presupuesto * umbral)
    return ['warn', 'Ya vas llegando al límite de hoy.'];
  return ['', ''];
}

/* Compara lo que hay en las cuentas con lo que dice la app */
function conciliar(S, c) {
  const cuentas = (S.cuentas || []).filter(x => !x.x);
  const total = suma(cuentas, x => +x.m || 0);
  const apartadoEnMetas = suma(S.spent.filter(e => e.meta), e => e.amt);
  return {
    hayCuentas: cuentas.some(x => (+x.m || 0) > 0),
    total,
    diferencia: total - c.saldo - apartadoEnMetas - (c.fondo.activo ? c.fondo.fondoPrev - c.fondo.usos : 0),
  };
}

/* Metas */
const juntadoEnMeta = (S, m) =>
  (+m.g0 || 0) + suma(S.spent.filter(e => e.meta === m.id), e => e.amt);
function aporteMensualSugerido(S, m, hoy) {
  const falta = Math.max(0, m.t - juntadoEnMeta(S, m));
  if (!(m.t > 0 && falta > 0 && m.f)) return 0;
  return Math.round(falta / Math.max(1, (numeroDeDia(m.f) - numeroDeDia(hoy)) / 30.4));
}

/* Cierre nocturno: congela los días ya cerrados y guarda una copia.
   Devuelve true si cambió algo (hay que guardar). */
function congelarDias(S, hoy, incluirHoy) {
  S.cierres = S.cierres || {};
  let ultimo = null;
  diasDelPeriodo(S, hoy).forEach(x => {
    if (!S.cierres[x.iso] && (x.iso < hoy || (incluirHoy && x.iso === hoy))) {
      S.cierres[x.iso] = { b: redondear2(x.presupuesto), g: x.gasto, l: redondear2(x.sobra) };
      ultimo = x.iso;
    }
  });
  if (!ultimo) return false;
  const { copias, cierres, ...resto } = S;
  S.copias = (S.copias || []).concat([{ iso: ultimo, json: JSON.stringify(resto) }]).slice(-14);
  return true;
}
const estaCerrado = (S, iso) => !!(S.cierres && S.cierres[iso]);

/* Pasar al período siguiente: guarda el actual en el historial y vuelve a cero.
   Los ingresos se mantienen; las cuotas avanzan una y las terminadas se sacan.
   Devuelve los nombres de los gastos que terminaron de pagarse. */
function iniciarPeriodo(S, hoy, { sueldo, previo, inicio, fin }) {
  const c = calcular(S, hoy);
  S.hist = (S.hist || []).concat([{
    start: S.start, end: S.end, sueldo: S.sueldo, previo: S.previo,
    importantes: c.total, gastado: suma(S.spent.filter(e => !e.meta), e => e.amt), quedo: c.saldo,
    ahorro: c.fondo.activo ? redondear2(c.fondo.ahorroPeriodo) : undefined,
  }]);
  /* modo fondo: lo ahorrado queda guardado aparte y no entra en el presupuesto del período nuevo */
  if (c.fondo.activo) { S.fondoPrev = redondear2(c.fondo.total); S.fondoRetirado = redondear2((+S.fondoRetirado || 0) + c.fondo.usos); S.fondoUsos = []; }
  const terminadas = avanzarCuotas(S);
  /* Gastos fijos: los que no tienen el tilde de repetir se sacan (salvo los que están en cuotas);
     los marcados con "el monto cambia" quedan con el monto vacío. Los gastos de versiones viejas se mantienen. */
  S.items = S.items.filter(i => tieneCuotas(i) || i.f !== false);
  S.items.forEach(i => { i.p = false; delete i.d; delete i.x; if (i.v && !tieneCuotas(i)) i.a = 0; });
  /* Gastos anotados por adelantado: pasan a ser gastos del período nuevo */
  (S.proximos || []).filter(x => x.n || x.a).forEach(x => S.items.push({ n: x.n || '', a: +x.a || 0, p: false, f: false, v: false }));
  S.proximos = [];
  S.fondoDesde = '';
  S.cierres = {}; S.ajustes = []; S.spent = []; S.recal = null;
  if (sueldo !== undefined) { S.sueldo = sueldo; S.ingresos = [{ cat: 'Sueldo', a: sueldo }]; }
  S.previo = previo; S.start = inicio; S.end = fin;
  return terminadas;
}

/* Ingresos: de dónde viene la plata. El total alimenta a S.sueldo, que usa el cálculo. */
const CATEGORIAS_INGRESO = ['Sueldo', 'Trabajo independiente', 'Efectivo', 'Changas o trabajo extra', 'Alquileres',
  'Jubilación o pensión', 'Ventas o negocio', 'Ayuda familiar', 'Otros'];
const totalIngresos = S => suma(S.ingresos || [], i => +i.a || 0);

/* Cuotas: un gasto en cuotas tiene q = { actual: 5, total: 12 }. Sin q, es un pago único. */
const tieneCuotas = i => !!(i.q && i.q.total > 1);
const cuotasRestantes = i => tieneCuotas(i) ? Math.max(0, i.q.total - i.q.actual) : 0;
const resumenCuotas = S => S.items.filter(tieneCuotas).map(i => ({
  n: i.n, actual: i.q.actual, total: i.q.total, monto: montoDe(i),
  restantes: cuotasRestantes(i), restoTotal: montoDe(i) * cuotasRestantes(i) }));
function avanzarCuotas(S) {
  const terminadas = [];
  S.items = S.items.filter(i => {
    if (!tieneCuotas(i)) return true;
    if (i.q.actual >= i.q.total) { terminadas.push(i.n || 'Gasto en cuotas'); return false; }
    i.q.actual += 1;
    return true;
  });
  return terminadas;
}

/* Repara datos de versiones anteriores: crea la lista de ingresos a partir del sueldo
   y decide si ya se hizo la introducción (quien ya usaba la app no la ve). */
function migrarEstado(S) {
  if (!S.ingresos) S.ingresos = [{ cat: 'Sueldo', a: +S.sueldo || 0 }];
  if (S.bienvenida === undefined) S.bienvenida = (+S.sueldo > 0) || (S.spent || []).length > 0;
  return S;
}

/* Copias de seguridad: ¿hay que avisar que hace días que no se guarda una?
   - S.ultimaCopia: cuándo se guardó la última (milisegundos).
   - S.diasCopia: cada cuántos días recordar (7 por defecto, 0 = nunca).
   - S.posponerCopia: hasta cuándo no molestar después de tocar "Más tarde".
   Si nunca se guardó una, se avisa recién cuando ya hay algunos gastos anotados. */
function estadoCopia(S, ahora) {
  const cada = S.diasCopia === undefined ? 7 : S.diasCopia;
  const dias = S.ultimaCopia ? Math.max(0, Math.floor((ahora - S.ultimaCopia) / MS_DIA)) : null;
  const pospuesto = !!S.posponerCopia && ahora < S.posponerCopia;
  let avisar = false;
  if (cada > 0 && !pospuesto) avisar = dias === null ? (S.spent || []).length >= 3 : dias >= cada;
  return { dias, avisar, cada };
}

/* Racha en verde: días seguidos (hasta ayer) sin pasarse del presupuesto.
   `ultimos` son los últimos 7 días cerrados, del más viejo al más nuevo (true = en verde). */
function rachaEnVerde(S, hoy) {
  const dias = diasDelPeriodo(S, hoy), hoyIdx = calcular(S, hoy).hoyIdx;
  let racha = 0;
  for (let i = hoyIdx - 1; i >= 0 && dias[i].sobra >= 0; i--) racha++;
  const ultimos = [];
  for (let i = Math.max(0, hoyIdx - 7); i < hoyIdx; i++) ultimos.push(dias[i].sobra >= 0);
  return { racha, ultimos };
}

/* Objetivo diario: cuánto querés gastar por día y cuánto te sobra si lo cumplís.
   - disponibleHoy: la plata que tenías al empezar hoy (saldo + lo gastado hoy).
   - promedio: lo máximo que podrías gastar por día, parejo, hasta el fin del período.
   - proyectado: lo que te sobra al final si gastás justo el objetivo desde hoy. */
function objetivoDiario(S, hoy) {
  const obj = +S.objetivo || 0;
  if (!(obj > 0)) return null;
  const c = calcular(S, hoy), dias = diasDelPeriodo(S, hoy);
  const disponibleHoy = c.saldo + c.gastoHoy;
  const proyectadoCon = o => disponibleHoy - o * c.faltan;
  /* "Ahorrado" cuenta solo desde el día en que se puso el objetivo (S.objetivoDesde); si no hay fecha, desde hoy */
  const desdeIdx = S.objetivoDesde ? Math.min(c.hoyIdx, Math.max(0, numeroDeDia(S.objetivoDesde) - numeroDeDia(S.start))) : c.hoyIdx;
  let ahorradoAntes = 0;
  for (let i = desdeIdx; i < c.hoyIdx; i++) ahorradoAntes += obj - dias[i].gasto;
  const paso = Math.max(500, Math.round(obj * 0.1 / 500) * 500);
  const escenarios = [-2, -1, 0, 1].map(k => obj + k * paso).filter(o => o > 0)
    .map(o => ({ o, sobra: proyectadoCon(o), actual: o === obj }));
  return {
    obj, faltan: c.faltan, gastoHoy: c.gastoHoy, disponibleHoy,
    promedio: disponibleHoy / c.faltan,
    proyectado: proyectadoCon(obj),
    ahorroHoy: obj - c.gastoHoy,
    ahorradoAntes, diasPrevios: c.hoyIdx - desdeIdx, escenarios,
  };
}

/* =====================================================================
   02b · EXPORTAR — Excel (.xlsx) y PDF armados a mano, sin librerías
   (la app tiene que funcionar sin internet). Funciones puras.
   ===================================================================== */
const VERSION_APP = '9.9.20';
const aBytes = txt => new TextEncoder().encode(txt);
const aBase64 = bytes => {
  let b = '';
  for (let i = 0; i < bytes.length; i += 0x8000) b += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(b);
};
const TABLA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = TABLA_CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function juntarBytes(lista) {
  const total = lista.reduce((t, x) => t + x.length, 0), salida = new Uint8Array(total);
  let pos = 0; lista.forEach(x => { salida.set(x, pos); pos += x.length; });
  return salida;
}

/* .zip sin comprimir (alcanza para armar un .xlsx). archivos = [{ n: nombre, d: Uint8Array }] */
function crearZip(archivos) {
  const u16 = n => [n & 255, (n >> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  const locales = [], centrales = []; let pos = 0;
  archivos.forEach(a => {
    const nombre = aBytes(a.n), crc = crc32(a.d), tam = a.d.length;
    const local = Uint8Array.from([].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21),
      u32(crc), u32(tam), u32(tam), u16(nombre.length), u16(0)));
    locales.push(local, nombre, a.d);
    centrales.push(Uint8Array.from([].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0x21),
      u32(crc), u32(tam), u32(tam), u16(nombre.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(pos))), nombre);
    pos += local.length + nombre.length + tam;
  });
  const central = juntarBytes(centrales);
  const fin = Uint8Array.from([].concat(u32(0x06054b50), u16(0), u16(0), u16(archivos.length), u16(archivos.length),
    u32(central.length), u32(pos), u16(0)));
  return juntarBytes(locales.concat([central, fin]));
}

const xmlEsc = s => String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '')
  .replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const XT = s => ({ s, b: 1 }), XM = n => ({ m: n });          // XT: texto en negrita · XM: monto en pesos
function celdaXlsx(v, r, c) {
  if (v === '' || v == null) return '';
  const ref = String.fromCharCode(65 + c) + (r + 1);
  if (typeof v === 'number') return Number.isFinite(v) ? `<c r="${ref}"><v>${v}</v></c>` : '';
  if (v.m !== undefined) return Number.isFinite(v.m) ? `<c r="${ref}" s="2"><v>${Math.round(v.m * 100) / 100}</v></c>` : '';
  const texto = v.s !== undefined ? v.s : v;
  return `<c r="${ref}" t="inlineStr"${v.b ? ' s="1"' : ''}><is><t xml:space="preserve">${xmlEsc(texto)}</t></is></c>`;
}

/* ---------- PDF (texto con letra de ancho fijo, páginas A4) ---------- */
const pdfTxt = s => String(s).replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[“”]/g, '"').replace(/[‘’]/g, "'")
  .replace(/[^\x20-\xFF]/g, '').replace(/[\\()]/g, '\\$&');
function crearPdf(lineas, pie) {
  const TOPE = 800, BASE = 50, ALTO_LINEA = 12.5, porPagina = Math.floor((TOPE - BASE) / ALTO_LINEA);
  const paginas = [];
  for (let i = 0; i < lineas.length; i += porPagina) paginas.push(lineas.slice(i, i + porPagina));
  if (!paginas.length) paginas.push([{ t: '' }]);
  const objetos = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    `<< /Type /Pages /Kids [${paginas.map((_, k) => (6 + k * 2) + ' 0 R').join(' ')}] /Count ${paginas.length} >>`,
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>',
    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
  ];
  paginas.forEach((pagina, k) => {
    let y = TOPE, cs = '';
    pagina.forEach(l => {
      cs += `BT /${l.g ? 'F3' : l.b ? 'F2' : 'F1'} ${l.g ? 16 : 9.5} Tf 40 ${y.toFixed(1)} Td (${pdfTxt(l.t)}) Tj ET\n`;
      y -= ALTO_LINEA;
    });
    cs += `BT /F1 8 Tf 40 28 Td (${pdfTxt(pie + '  -  pagina ' + (k + 1) + ' de ' + paginas.length)}) Tj ET\n`;
    objetos.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents ${7 + k * 2} 0 R >>`);
    objetos.push(`<< /Length ${cs.length} >>\nstream\n${cs}endstream`);
  });
  let pdf = '%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n'; const offsets = [];
  objetos.forEach((o, i) => { offsets.push(pdf.length); pdf += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n` + offsets.map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('') +
    `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return Uint8Array.from(pdf, ch => ch.charCodeAt(0));
}
function pdfExportar(d) {
  const izq = (t, n) => String(t).slice(0, n).padEnd(n), der = (t, n) => String(t).slice(0, n).padStart(n);
  const L = [{ t: 'Mi plata - Resumen', g: 1 }, { t: '' }, { t: 'Creado el ' + d.fecha(d.hoy), b: 0 }, { t: '' }, { t: 'RESUMEN', b: 1 }];
  d.resumen.forEach(r => L.push({ t: izq(r[0], 34) + der(r[2] ? pesos(r[1]) : r[1], r[2] ? 16 : 28) }));
  L.push({ t: '' }, { t: 'DIA POR DIA', b: 1 }, { t: izq('Dia', 15) + der('Presupuesto', 14) + der('Gasto', 14) + der('Sobrante', 14), b: 1 });
  d.dias.forEach(x => L.push({ t: izq(x.dia.slice(0, 3) + ' ' + x.fecha, 15) + der(pesos(x.presupuesto), 14) +
    der(x.gasto ? pesos(x.gasto) : '', 14) + der(x.pasado ? pesos(x.sobra) : '', 14) }));
  L.push({ t: '' }, { t: 'GASTOS ANOTADOS', b: 1 });
  if (!d.gastos.length) L.push({ t: 'Todavia no hay gastos anotados.' });
  d.gastos.forEach(x => L.push({ t: izq(x.fecha.slice(0, 5), 7) +
    izq((x.tipo === 'Gasto' ? (x.cat ? x.cat + ' - ' : '') : '') + (x.nota || x.tipo), 46) + der(pesos(x.amt), 14) }));
  L.push({ t: '' }, { t: 'GASTOS IMPORTANTES', b: 1 });
  if (!d.importantes.length) L.push({ t: 'No cargaste gastos importantes.' });
  d.importantes.forEach(x => L.push({ t: izq(x.n, 34) + der(pesos(x.a), 14) + '  ' + x.estado + (x.cuotas ? ' (cuota ' + x.cuotas + ')' : '') }));
  return crearPdf(L, 'Mi plata v' + VERSION_APP);
}

/* --- PIN guardado con sal y derivación lenta (PBKDF2) --- */
const aHex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
async function hashPin(pin, sal) {
  const texto = 'miplata:' + pin, cod = new TextEncoder();
  try {
    if (!sal) return aHex(await crypto.subtle.digest('SHA-256', cod.encode(texto))); // PINs de versiones viejas
    const llave = await crypto.subtle.importKey('raw', cod.encode(texto), 'PBKDF2', false, ['deriveBits']);
    return aHex(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: cod.encode(sal), iterations: 150000, hash: 'SHA-256' }, llave, 256));
  } catch (_) {
    let h = 0; for (const ch of texto + (sal || '')) h = (h * 31 + ch.charCodeAt(0)) | 0;
    return 'f' + h;
  }
}
const pinCorrecto = async pin => (await hashPin(pin, S.salt)) === S.pin;
async function fijarPin(pin) {
  let sal; try { sal = aHex(crypto.getRandomValues(new Uint8Array(12))); } catch (_) { sal = String(Date.now()); }
  S.salt = sal; S.pin = await hashPin(pin, sal);
}

function leerIntentos() { try { return JSON.parse(localStorage.getItem('miplata_sec')) || {}; } catch (_) { return {}; } }

function registrarFallo() {
  intentos.f = (intentos.f || 0) + 1;
  if (intentos.f >= 5) intentos.u = Date.now() + Math.min(900, 30 * Math.pow(2, intentos.f - 5)) * 1000;
  guardarIntentos();
}
const segundosDeEspera = () =>
  intentos.u && Date.now() < intentos.u ? Math.ceil((intentos.u - Date.now()) / 1000) : 0;
function limpiarFallos() { intentos = {}; guardarIntentos(); }

/* Intenta con un PIN. Devuelve true si es correcto; si no, avisa. */
async function probarPin(pin, campo) {
  if (segundosDeEspera()) { aviso('Esperá ' + segundosDeEspera() + ' segundos.'); return false; }
  if (await pinCorrecto(pin)) { limpiarFallos(); return true; }
  registrarFallo(); if (campo) campo.value = ''; aviso('PIN incorrecto.');
  return false;
}

/* Ventanita que pide el PIN. Devuelve true/false. */
function pedirPin(textoBoton = 'Mostrar') {
  return new Promise(resolver => {

      '<input id="rp" type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:22px;letter-spacing:6px">' +
      '<div class="f" style="margin-top:12px;justify-content:center"><button id="rok">' + textoBoton +
      '</button><button class="sec" id="rno">Cancelar</button></div>', 320, 20, 'text-align:center');
    const campo = m.querySelector('#rp'); campo.focus();
    const cerrar = v => { m.remove(); resolver(v); };
    m.querySelector('#rno').onclick = () => cerrar(false);
    m.querySelector('#rok').onclick = async () => { if (await probarPin(campo.value, campo)) cerrar(true); };
    campo.onkeydown = e => { if (e.key === 'Enter') m.querySelector('#rok').click(); };
  });
}

async function operacionPin(op) {
  const valor = id => (document.getElementById(id) || {}).value || '', formato = /^\d{4,8}$/;
  if (op === 'on') {
    const nuevo = valor('pn');
    if (!formato.test(nuevo) || nuevo !== valor('pr')) { aviso('El PIN debe tener 4 a 8 números y coincidir en los dos campos.'); return; }
    await fijarPin(nuevo); guardar(); aviso('PIN activado.'); dibujar(); return;
  }
  if (!(await pinCorrecto(valor('pa')))) { aviso('El PIN actual no coincide.'); return; }
  if (op === 'off') { delete S.pin; delete S.salt; guardar(); aviso('PIN desactivado.'); dibujar(); return; }

/* Dictado de gastos: entiende frases como "quince mil quinientos en el súper" sin internet y sin IA */
const NUM_PALABRAS = {cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900,mil:1000,luca:1000,lucas:1000,millon:1e6,millones:1e6,palo:1e6,palos:1e6};
const CLAVES_CAT = [
  ['Súper', ['super','supermercado','mercado','almacen','chino','hipermercado']],
  ['Transporte', ['nafta','combustible','gasoil','colectivo','bondi','sube','taxi','uber','remis','peaje','estacionamiento','cochera','pasaje']],
  ['Salud', ['farmacia','remedio','remedios','medico','doctor','dentista','consulta','medicamento','pastillas','analisis']],
  ['Salidas', ['cine','salida','boliche','bar','birra','cerveza','cervezas','restaurante','asado','recital','entrada','pelicula','juntada']],
  ['Comida', ['comida','almuerzo','cena','desayuno','merienda','pizza','pizzas','carne','carniceria','pan','panaderia','verduleria','verdura','fruta','kiosco','cafe','empanadas','helado','gaseosa','bebida','hamburguesa','milanesa','facturas']],
];
const RELLENO_DICTADO = new Set(['de','en','el','la','los','las','un','una','por','con','para','a','al','que','pesos','peso','ars','gaste','gasto','pague','pago','compre','me','salio','salieron','fue','fueron','mi','mis','y']);
const sinTilde = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const esDigito = t => /^\d/.test(t);
const esNumPalabra = t => Object.prototype.hasOwnProperty.call(NUM_PALABRAS, t);
const esNum = t => esDigito(t) || esNumPalabra(t);
function numDigitos(t) {
  if (/^\d{1,3}(,\d{3})+$/.test(t)) t = t.replace(/,/g, '');
  t = t.replace(/\.(?=\d{3}(?:\D|$))/g, '').replace(',', '.');
  const n = parseFloat(t); return isNaN(n) ? 0 : n;
}
function valorNumero(toks) {
  let total = 0, actual = 0;
  for (const t of toks) {
    if (t === 'y') continue;
    if (esDigito(t)) { actual += numDigitos(t); continue; }
    const v = NUM_PALABRAS[t];
    if (v >= 1000) { total += (actual || 1) * v; actual = 0; } else actual += v;
  }
  return Math.round((total + actual) * 100) / 100;
}
/* Devuelve { monto, detalle, cat } o null si no encuentra un monto */
function gastoDesdeFrase(texto) {
  const orig = String(texto).toLowerCase().replace(/[$¿?¡!;:()"]/g, ' ').split(/\s+/).filter(Boolean).map(t => t.replace(/[.,]+$/, '')).filter(Boolean);
  const norm = orig.map(sinTilde);
  let mejor = null;
  for (let i = 0; i < norm.length; i++) {
    if (!esNum(norm[i])) continue;
    let j = i;
    while (j + 1 < norm.length) {
      if (esNum(norm[j + 1])) j++;
      else if (norm[j + 1] === 'y' && j + 2 < norm.length && esNum(norm[j + 2]) && !esDigito(norm[j]) && !esDigito(norm[j + 2])) j += 2;
      else break;
    }
    const valor = valorNumero(norm.slice(i, j + 1));
    if (valor > 0 && (!mejor || valor > mejor.valor)) mejor = { ini: i, fin: j, valor };
    i = j;
  }
  if (!mejor) return null;
  const resto = orig.map((t, k) => [t, norm[k], k]).filter(x => x[2] < mejor.ini || x[2] > mejor.fin);
  while (resto.length && RELLENO_DICTADO.has(resto[0][1])) resto.shift();
  while (resto.length && RELLENO_DICTADO.has(resto[resto.length - 1][1])) resto.pop();
  let detalle = resto.map(x => x[0]).join(' ');
  detalle = detalle.charAt(0).toUpperCase() + detalle.slice(1);
  const palabras = new Set(resto.map(x => x[1]));
  let cat = '';
  for (const [nombre, claves] of CLAVES_CAT) if (claves.some(c => palabras.has(c))) { cat = nombre; break; }
  return { monto: mejor.valor, detalle, cat };
}

function usarFraseDictada(t) {
  if (hayClaude()) { aviso('Escuché: ' + t); extraerGasto('Frase: ' + t, []); return; }

async function dictarGasto() {
  const SR = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SpeechRecognition;
  if (SR) {            // dentro del APK: dictado nativo de Android
    try {
      const disp = await SR.available();
      if (!disp || !disp.available) { aviso('Este teléfono no tiene dictado por voz. Usá el micrófono del teclado.'); return; }
      let permiso = await SR.checkPermissions();
      if (permiso.speechRecognition !== 'granted') permiso = await SR.requestPermissions();
      if (permiso.speechRecognition !== 'granted') { aviso('Sin permiso de micrófono no puedo escucharte. Podés darlo en Ajustes del teléfono → Apps → Mi plata → Permisos.'); return; }
      const r = await SR.start({ language: 'es-AR', maxResults: 3, prompt: 'Decí el gasto. Ej: quince mil en el súper', partialResults: false, popup: true });
      const t = r && r.matches && r.matches[0];
      if (t) usarFraseDictada(t); else aviso('No te escuché. Probá de nuevo.');
    } catch (_) { aviso('No se pudo dictar. Probá de nuevo o usá el micrófono del teclado.'); }
    return;
  }
  const Reconocedor = window.SpeechRecognition || window.webkitSpeechRecognition;   // versión web
  if (!Reconocedor) { aviso('Acá no hay dictado. Usá el micrófono del teclado del teléfono.'); return; }
  const r = new Reconocedor(); r.lang = 'es-AR'; r.interimResults = false;
  r.onresult = ev => usarFraseDictada(ev.results[0][0].transcript);
  r.onerror = () => aviso('No pude usar el micrófono acá. Probá con el micrófono del teclado.');
  try { r.start(); aviso('Escuchando… decí el gasto'); } catch (_) { aviso('No pude usar el micrófono.'); }
}

async function leerTicket(archivo) {

    lienzo.width = Math.round(bmp.width * k); lienzo.height = Math.round(bmp.height * k);
    lienzo.getContext('2d').drawImage(bmp, 0, 0, lienzo.width, lienzo.height);
    const jpg = await new Promise(r => lienzo.toBlob(r, 'image/jpeg', 0.8));
    aviso('Leyendo el ticket…');
    await extraerGasto('Es la foto de un ticket o comprobante. El monto es el TOTAL pagado y el detalle es el comercio.', [jpg]);
  } catch (_) { aviso('No pude leer la foto.'); }

/* Guarda un archivo. Devuelve true si se guardó o se mandó a algún lado, false si no. */
async function descargar(nombre, texto) {
  const plugins = window.Capacitor && window.Capacitor.Plugins;
  if (CONFIG.apk && plugins && plugins.Filesystem && plugins.Share) {   // app Android: menú de compartir (Drive, etc.)
    try {
      const archivo = await plugins.Filesystem.writeFile({ path: nombre, data: texto, directory: 'CACHE', encoding: 'utf8' });
      await plugins.Share.share({ title: nombre, url: archivo.uri, dialogTitle: 'Guardar o enviar ' + nombre });
      return true;
    } catch (e) {
      if (/cancel/i.test(String((e && e.message) || e))) return false;   // la persona cerró el menú
      mostrarTextoParaCopiar(texto); return false;
    }
  }
  let servicio = null;
  try { servicio = CONFIG.claude && window.claude ? await window.claude.use('downloads') : null; } catch (_) {}
  if (servicio) {                                  // dentro de Claude
    try { await servicio.save({ filename: nombre, data: texto }); return true; }
    catch (e) { if (!e || e.code !== 'declined') aviso('No se pudo guardar el archivo.'); return false; }
  }
  if (!CONFIG.claude) try {                        // en un sitio normal (PWA)
    const url = URL.createObjectURL(new Blob([texto], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
    return true;
  } catch (_) {}
  mostrarTextoParaCopiar(texto);
  return false;
}

/* Guarda un archivo directo en la carpeta Documentos del teléfono (Documentos/MiPlata/).
   Devuelve true si se guardó. Solo funciona en la app Android. */

  const plugins = window.Capacitor && window.Capacitor.Plugins;
  if (!(CONFIG.apk && plugins && plugins.Filesystem)) return false;
  try {
    const pedido = { path: 'MiPlata/' + nombre, data: datos, directory: 'DOCUMENTS', recursive: true };
    if (!esBase64) pedido.encoding = 'utf8';
    await plugins.Filesystem.writeFile(pedido);

}

/* Entrega un archivo binario (Excel, PDF): lo deja en Documentos/MiPlata y abre el menú de compartir */
async function entregarArchivo(nombre, bytes, tipo) {
  const plugins = window.Capacitor && window.Capacitor.Plugins;
  if (CONFIG.apk && plugins && plugins.Filesystem) {
    const base64 = aBase64(bytes);
    const guardado = await guardarEnDocumentos(nombre, base64, true);
    if (guardado) aviso('Guardado en Documentos/MiPlata/' + nombre);
    if (plugins.Share) {
      try {
        const archivo = await plugins.Filesystem.writeFile({ path: nombre, data: base64, directory: 'CACHE' });
        await plugins.Share.share({ title: nombre, url: archivo.uri, dialogTitle: 'Enviar ' + nombre });
        return true;
      } catch (_) {}
    }
    if (!guardado) aviso('No se pudo guardar el archivo.');
    return guardado;
  }
  try {                                           // navegador
    const url = URL.createObjectURL(new Blob([bytes], { type: tipo }));
    const a = document.createElement('a'); a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 3000);
    return true;
  } catch (_) { aviso('No se pudo guardar el archivo.'); return false; }
}

/* ------------------------------ HOY ------------------------------ */
function pantallaHoy(c) {
  const hoy = hoyISO(), editado = S.spent.find(e => e.id === UI.editando);
  const presupuesto = c.quedaHoy + c.gastoHoy;
  const porcentaje = presupuesto > 0 ? Math.min(100, c.gastoHoy / presupuesto * 100) : 100;
  const [clase, mensaje] = semaforo(c, S), nombre = nombreUsuario();
  return [
    `<div style="margin:4px 2px 12px"><div style="font-size:20px;font-weight:700">${saludoSegunHora(new Date().getHours())}${nombre ? ', ' + escapar(nombre) : ''}</div>` +
      `<div class="mut">${fraseDeEstado(c, clase)}</div><div class="mut" style="margin-top:4px;font-style:italic">“${fraseDelDia(hoy)}”</div>` +
      `<button class="sec" data-a="resumen" style="margin-top:8px;padding:8px 12px">Compartir resumen</button></div>`,
    S.sueldo ? '' : '<div class="card mut">Primero cargá tu sueldo en Ajustes y revisá tus gastos importantes.</div>',
    /* orden pensado para el uso diario: primero lo que se mira y lo que se hace todos los días */
    tarjetaQuedaHoy(c, clase, mensaje, presupuesto, porcentaje),
    tarjetaAnotarGasto(editado, hoy),          /* SIEMPRE justo debajo de "Te queda para hoy" */
    tarjetaFondo(c),
    tarjetaGastosAnotados(),
    tarjetaRacha(),
    tarjetaAvisoCopia(),
    tarjetaSaldo(c),
    tarjetaCuentas(c),
    tarjetaRecalibrar(c),
  ].join('');
}

/* Objetivo diario: elegís cuánto querés gastar por día y la app te muestra cuánto te sobra */
function tarjetaObjetivo(c) {
  const o = objetivoDiario(S, hoyISO());
  const campo = `<div class="f"><input type="${campoDinero()}" inputmode="decimal" data-f="objetivo" placeholder="Ej: 10000" value="${S.objetivo || ''}">` +
    '<button class="sec" data-a="usarBase">Usar el de la app</button></div>';
  let cuerpo;
  if (!o) {
    cuerpo = '<div class="mut" style="margin-bottom:8px">Escribí cuánta plata querés gastar por día y apretá Enter: ese pasa a ser tu límite de cada día (el de "Te queda para hoy") y te digo cuánto te sobra para ahorrar.</div>' + campo;
  } else {
    const aplicado = !!(S.recal && S.recal.obj && S.recal.base === S.objetivo);
    const alcanza = o.proyectado >= 0;
    const mensaje = alcanza
      ? `Si gastás <b>${dinero(o.obj)}</b> por día, al final del período te sobran <b class="num-ok">${dinero(o.proyectado)}</b> para ahorrar.`
      : `Con <b>${dinero(o.obj)}</b> por día te faltarían <b class="neg">${dinero(-o.proyectado)}</b>. Tu plata alcanza para <b>${dinero(o.promedio)}</b> por día.`;
    const hoyTxt = o.ahorroHoy >= 0
      ? `Hoy vas <b>${dinero(o.ahorroHoy)}</b> por debajo de tu objetivo.`
      : `Hoy te pasaste <b class="neg">${dinero(-o.ahorroHoy)}</b> de tu objetivo.`;
    const antes = o.diasPrevios > 0
      ? filaDoble('Ahorrado vs. objetivo (días anteriores)', `<span class="${o.ahorradoAntes < 0 ? 'neg' : ''}">${dinero(o.ahorradoAntes)}</span>`) : '';
    const filas = o.escenarios.map(x =>
      `<div class="row"><span>${x.actual ? '👉 ' : ''}Gastando ${dinero(x.o)} por día</span><b class="${x.sobra < 0 ? 'neg' : ''}">${x.sobra < 0 ? 'faltan ' + dinero(-x.sobra) : 'sobran ' + dinero(x.sobra)}</b></div>`).join('');
    const sinAplicar = aplicado ? '' : '<div class="mut" style="margin:10px 0 0">Este número todavía <b>no</b> es tu límite oficial de hoy.</div>' +
      '<div class="f" style="margin-top:8px"><button data-a="usarObjetivo">Usar como mi límite de hoy</button></div>';
    cuerpo = campo + sinAplicar + `<div style="margin:10px 0">${mensaje}</div><div class="mut" style="margin-bottom:6px">${hoyTxt}</div>` +
      filaDoble('Máximo parejo por día', dinero(o.promedio)) + filaDoble(`Días que faltan (con hoy)`, o.faltan) + antes +
      '<div class="mut" style="margin:10px 0 4px">Probá distintos gastos por día:</div>' + filas +
      '<div class="mut" style="font-size:13px;margin-top:8px">' + (aplicado ? 'Este objetivo es ahora tu límite diario oficial. Para volver a tu límite normal, borrá el número y apretá Enter. ' : '') + 'Lo que te sobre lo podés juntar en una meta (pestaña Plan).</div>';
  }
  return '<div class="card"><h2>🎯 Mi objetivo por día</h2>' + cuerpo + '</div>';
}

/* Racha en verde con puntitos de los últimos días */
function tarjetaRacha() {
  const r = rachaEnVerde(S, hoyISO());
  if (!r.ultimos.length) return '';
  const puntos = r.ultimos.map(ok => `<span style="display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:6px;background:${ok ? 'var(--ok)' : 'var(--bad)'}"></span>`).join('');
  const mensaje = r.racha === 0 ? 'Hoy podés empezar una racha: terminá el día sin pasarte.'
    : r.racha >= 7 ? '¡Una semana entera o más en verde!' : r.racha >= 3 ? '¡Vas muy bien, no cortes la racha!' : 'Buen comienzo.';
  return `<div class="card"><div style="font-weight:700">🔥 Racha en verde: ${r.racha} ${r.racha === 1 ? 'día' : 'días'}</div>` +
    `<div style="margin:8px 0">${puntos}</div><div class="mut">${mensaje}</div></div>`;
}

/* Aviso en Hoy cuando hace días que no se guarda una copia (no aparece dentro de Claude, que ya sincroniza) */
function tarjetaAvisoCopia() {
  if (CONFIG.nube || S.demo) return '';
  const e = estadoCopia(S, Date.now());
  if (!e.avisar) return '';
  const texto = e.dias === null ? 'Todavía no guardaste ninguna copia de tus datos.' : `Hace ${e.dias} días que no guardás una copia de tus datos.`;
  return `<div class="card" style="border-color:var(--warn)"><div style="font-weight:600">☁️ ${texto}</div>` +
    '<div class="mut" style="margin:4px 0 10px">Si cambiás de teléfono o lo formateás, sin copia se pierde todo.</div>' +
    '<div class="f" style="margin:0"><button data-a="guardarNube">Guardar ahora</button>' + (CONFIG.apk ? '<button class="sec" data-a="guardarEnTelefono">📱 En el teléfono</button>' : '') + '<button class="sec" data-a="posponerCopia">Más tarde</button></div></div>';
}

const colorClase = clase => clase === 'neg' ? 'var(--bad)' : clase === 'warn' ? 'var(--warn)' : 'var(--ok)';
function anillo(gastadoPct, clase) {
  const resto = Math.max(0, Math.min(100, 100 - gastadoPct)), largo = 2 * Math.PI * 38;
  return `<div class="anillo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="var(--bd)" stroke-width="10"/>` +
    `<circle cx="50" cy="50" r="38" fill="none" stroke="${colorClase(clase)}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(largo * resto / 100).toFixed(1)} ${largo.toFixed(1)}"/></svg><b>${Math.round(resto)}%</b></div>`;
}
function chipCategoria(cat) {
  const k = CATEGORIAS_GASTO.findIndex(x => x[1] === cat);
  return `<i class="kchip k${k < 0 ? 5 : k}">${k < 0 ? '💸' : CATEGORIAS_GASTO[k][0]}</i>`;
}
/* Una barra por día: verde = dentro del límite, rojo = te pasaste. La raya es la base por día. */
function graficoDias(c) {
  const dias = diasDelPeriodo(S, hoyISO()).filter(x => x.i <= c.hoyIdx);
  if (dias.length < 2) return '';
  const tope = Math.max(1, c.baseHoy, ...dias.map(x => x.gasto)) * 1.1, W = 300, H = 90, ancho = W / dias.length;
  const barras = dias.map(x => { const h = Math.max(1, x.gasto / tope * H);
    return `<rect x="${(x.i * ancho + ancho * 0.15).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(ancho * 0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${x.gasto > x.presupuesto + 0.5 ? 'var(--bad)' : 'var(--ok)'}"/>`; }).join('');
  const y = H - c.baseHoy / tope * H;
  return '<div class="card"><h2>Mis días</h2>' + `<svg class="grafico" viewBox="0 0 ${W} ${H}">${barras}<line x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--mut)" stroke-dasharray="4 4"/></svg>` +
    '<div class="mut" style="font-size:13px;margin-top:6px">Cada barra es un día: verde = dentro del límite, rojo = te pasaste. La raya es tu base por día.</div></div>';
}
function lineaFondo(c) {
  const f = c.filas || [], pts = []; let acum = 0;
  f.slice(0, c.hoyIdx).forEach(x => { acum += x.aporte; pts.push(acum); });
  if (pts.length < 2) return '';
  const min = Math.min(0, ...pts), max = Math.max(1, ...pts), W = 300, H = 50;
  const p = pts.map((v, k) => `${(k / (pts.length - 1) * W).toFixed(1)},${(H - (v - min) / (max - min) * (H - 6) - 3).toFixed(1)}`).join(' ');
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" style="margin-top:8px"><polyline points="${p}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function tarjetaQuedaHoy(c, clase, mensaje, presupuesto, porcentaje) {
  return `<div class="card hero-card"><div class="mut">Te queda para hoy</div><div class="hero-fila"><div class="num ${clase}" style="margin:0;font-size:2.5rem">${pesosConCentavos(c.quedaHoy)}</div>${anillo(porcentaje, clase)}</div>` +
    `<div class="bar ${clase}"><i style="width:${porcentaje}%"></i></div>` +
    `<div class="mut">Presupuesto de hoy ${pesos(presupuesto)}. Gastaste ${pesos(c.gastoHoy)}.</div>` +
    (c.fondo.activo ? `<div class="mut" style="margin-top:4px">Lo que no gastes hoy va a tu fondo: <b class="${c.fondo.hoySuma < 0 ? 'neg' : ''}">${pesosConCentavos(c.fondo.hoySuma)}</b></div>` : '') +
    (c.manana != null ? `<div id="linea-manana" style="margin-top:8px">Mañana tendrás <b class="${c.manana < 0 ? 'neg' : ''}">${pesosConCentavos(c.manana)}</b></div>` : '') +
    (mensaje ? `<div class="${clase}" style="font-weight:600;margin-top:6px">${mensaje}</div>` : '') + '</div>';
}

/* Fondo de ahorro: se ve siempre en Hoy, sin tener que ir a otra pestaña */
function tarjetaFondo(c) {
  const f = c.fondo;
  if (!f.activo) return '';
  const usos = S.fondoUsos || [];
  const retirado = f.acumulado - f.total;
  const detalle = [
    'Este período: <b>' + dinero(f.ahorroPeriodo) + '</b>',
    f.fondoPrev ? 'De antes: <b>' + dinero(f.fondoPrev) + '</b>' : '',
    retirado > 0 ? 'Retiraste: <b>' + dinero(retirado) + '</b>' : '',
  ].filter(Boolean).join(' · ');
  const formulario = UI.usandoFondo
    ? '<div style="margin-top:10px;padding:12px;border:1px solid var(--ac);border-radius:10px"><label>¿Cuánto sacás del fondo?</label>' +
      `<input id="fu" inputmode="decimal" placeholder="Monto"><label>¿Para qué?</label><input id="fn" placeholder="Detalle (opcional)">` +
      '<label>¿Qué hacés con esa plata?</label><select id="fp"><option value="hoy">La voy a gastar hoy (suma a mi límite de hoy)</option><option value="cubre">Cubre gastos que ya hice / cuadrar con el banco (no suma a hoy)</option></select>' +
      '<div class="f" style="margin:10px 0 0"><button class="sec" data-a="cancelarUsoFondo">Cancelar</button><button data-a="confirmarUsoFondo">Sacar</button></div></div>'
    : '<div class="f" style="margin-top:8px"><button class="sec" data-a="usarFondo">Usar del fondo</button></div>';
  const lista = usos.length
    ? '<div style="margin-top:8px">' + usos.map((x, k) => `<div class="row"><span>${diaYMes(x.date)} ${escapar(x.note || 'Uso del fondo')}${x.para !== 'cubre' ? ' (para hoy)' : ''}</span><span><b>${dinero(-x.amt)}</b><button class="x" data-a="quitarUsoFondo" data-i="${k}">✕</button></span></div>`).join('') + '</div>'
    : '';
  return `<div class="card"><div class="mut">Mi fondo de ahorro ${botonOjo()}</div><div class="num">${dinero(f.total)}</div>` +
    `<div class="mut">${detalle}</div>` + lineaFondo(c) + formulario + lista + '</div>';
}

function tarjetaSaldo(c) {
  const cambia = c.baseManana != null && Math.abs(c.baseManana - c.baseHoy) >= 1;
  return '<div class="card">' +
    filaDoble(`Saldo del período ${botonOjo()}`, dinero(c.saldo)) +
    filaDoble('Días que faltan (con hoy)', c.faltan) +
    filaDoble(`Base por día${c.recal ? ' (recalibrada)' : ''}`, pesos(c.baseHoy)) +
    (cambia ? filaDoble('Base por día desde mañana', pesos(c.baseManana)) : '') + '</div>';
}

function tarjetaCuentas(c) {
  const cuentas = cuentasDe(), cc = conciliar(S, c);
  const filas = cuentas.map((x, k) =>
    `<div class="f"><input type="checkbox" data-f="cuentaCuenta" data-k="${k}" ${x.x ? '' : 'checked'}>` +
    `<input data-f="cuentaNombre" data-k="${k}" value="${escapar(x.n)}" placeholder="Cuenta">` +
    `<input type="${campoDinero()}" inputmode="decimal" data-f="cuentaSaldo" data-k="${k}" value="${x.m || ''}" placeholder="Saldo" style="max-width:120px">` +
    `<button class="x" data-a="quitarCuenta" data-i="${k}">✕</button></div>`).join('');
  const comparacion = cc.hayCuentas
    ? filaDoble('Total en cuentas', dinero(cc.total)) +
      filaDoble('Diferencia con la app', `<span class="${Math.abs(cc.diferencia) < 1 ? '' : 'warn'}">${dineroOculto() ? '••••••' : pesos(cc.diferencia)}</span>`)
    : '<div class="mut" style="margin:8px 0">Cargá el saldo de al menos una cuenta para compararlo con la app.</div>';
  const pendiente = UI.ajustePendiente == null ? '' :
    `<div style="margin-top:10px;padding:12px;border:1px solid var(--ac);border-radius:10px"><div style="margin-bottom:10px">El saldo previo cambia en <b>${pesos(UI.ajustePendiente)}</b>. ¿Seguir?</div>` +
    '<div class="f" style="margin:0"><button class="sec" data-a="ajusteNo">Cancelar</button><button data-a="ajusteSi">Aceptar</button></div></div>';
  const recomposiciones = (S.ajustes || []).length
    ? '<div style="margin-top:10px"><div class="mut">Recomposiciones (se reparten desde mañana entre los días que faltan)</div>' +
      S.ajustes.map((x, i) => `<div class="row"><span>${diaYMes(x.date)} ${escapar(x.note)}</span><span><b>${dineroOculto() ? '••••' : pesos(x.amt)}</b>` +
        `<button class="x" data-a="quitarRecomposicion" data-i="${i}">✕</button></span></div>`).join('') + '</div>'
    : '';
  const resumenFondo = c.fondo.activo
    ? '<div style="margin:8px 0">' + filaDoble('Disponible para gastar', dinero(c.fondo.disponible)) +
      filaDoble('Fondo de ahorro', dinero(c.fondo.total)) +
      filaDoble('Total (lo que tendrías en cuentas)', dinero(c.fondo.disponible + c.fondo.total)) + '</div>'
    : '';
  return '<div class="card"><h2>Mis cuentas</h2>' + filas + resumenFondo + comparacion +
    '<div class="f" style="margin-top:8px;flex-wrap:wrap"><button class="sec" data-a="agregarCuenta">Agregar cuenta</button>' +
    (cc.hayCuentas ? '<button data-a="ajustarCuentas">Ajustar con las cuentas</button>' : '') + '</div>' + pendiente + recomposiciones +
    '<div class="mut" style="font-size:13px;margin-top:6px">Las cuentas tildadas cuentan. Lo que apartaste para tus metas se considera dentro de ellas. Destildá, por ejemplo, la plata de reservas.</div></div>';
}

function tarjetaAnotarGasto(editado, hoy) {
  const b = UI.borrador;      // lo que ya se escribió pero todavía no se anotó
  const monto = b.amt !== undefined ? b.amt : (editado ? editado.amt : '');
  const detalle = b.note !== undefined ? b.note : (editado ? (editado.note || '') : '');
  const fecha = b.date !== undefined ? b.date : (editado ? editado.date : hoy);
  const categorias = '<div class="f" style="flex-wrap:wrap;gap:6px">' + CATEGORIAS_GASTO.map(([emoji, nombre]) =>
    `<button class="chip${UI.categoria === nombre ? ' on' : ''}" data-a="categoria" data-v="${nombre}">${emoji} ${nombre}</button>`).join('') + '</div>';
  const atajos = editado ? '' :
    '<div class="f"><button class="sec" data-a="dictar">🎤 Dictar</button>' +
    (CONFIG.claude ? '<label class="bt">📷 Foto de ticket<input id="ph" type="file" accept="image/*" capture="environment" hidden></label>' : '') + '</div>';
  return `<div class="card" id="tarjeta-anotar"><h2>${editado ? 'Editar gasto' : 'Anotar gasto'}</h2>` +
    `<div class="f"><input id="am" inputmode="decimal" placeholder="Monto" value="${escapar(monto)}"><input id="nt" placeholder="Detalle" value="${escapar(detalle)}"></div>` +
    categorias + atajos +
    `<div class="f"><input id="dt" type="date" value="${fecha}"></div>` +
    `<button data-a="anotar" style="width:100%">${editado ? 'Guardar cambios' : 'Anotar gasto'}</button>` +
    (editado ? '<button class="sec" data-a="cancelarEdicion" style="width:100%;margin-top:8px">Cancelar</button>' : '') + '</div>';
}

function tarjetaRecalibrar(c) {
  return '<div class="card"><h2>Recalibrar</h2><div class="mut" style="margin-bottom:10px">Si tuviste un gasto grande, reparte lo que te queda entre los días que faltan.</div>' +
    '<div class="f"><button class="sec" data-a="recalibrar">Recalibrar desde hoy</button>' +
    (c.recal ? '<button class="sec" data-a="quitarRecalibracion">Quitar</button>' : '') + '</div></div>';
}

function tarjetaGastosAnotados() {
  const todos = [...S.spent].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  const lista = UI.verTodos ? todos.slice(0, 60) : todos.slice(0, 5);     // en Hoy se ven los últimos 5
  const fila = e => `<div class="row"><span style="display:flex;align-items:center">${chipCategoria(e.cat)}<span>${escapar(e.note || e.cat || 'Gasto')}<br><small class="mut">${diaYMes(e.date)}</small></span></span><span><b>${pesos(e.amt)}</b>` +
    `<button class="x" data-a="editar" data-i="${e.id}">✎</button><button class="x" data-a="borrar" data-i="${e.id}">✕</button></span></div>`;
  return '<div class="card"><h2>Gastos anotados</h2>' + (lista.length ? lista.map(fila).join('') : '<div class="mut">Todavía no anotaste gastos.</div>') +
    (todos.length > 5 ? `<button class="sec" data-a="verTodos" style="width:100%;margin-top:10px">${UI.verTodos ? 'Ver solo los últimos 5' : 'Ver todos (' + todos.length + ')'}</button>` : '') + '</div>';
}

/* ------------------------------ DÍAS ------------------------------ */
function pantallaDias(c) {
  const hoy = hoyISO();
  const filas = diasDelPeriodo(S, hoy).map(x => {
    const pasado = x.i <= c.hoyIdx || x.gasto;
    return `<div class="tb${x.i === c.hoyIdx ? ' td' : ''}" data-d="${x.iso}"><span>${estaCerrado(S, x.iso) ? '🔒' : ''}${x.dia.slice(0, 3)} ${diaYMes(x.iso)}</span>` +
      `<span>${pesos(x.presupuesto)}</span><span>${x.gasto ? pesos(x.gasto) : ''}</span>` +
      `<span class="${pasado && x.sobra < 0 ? 'neg' : ''}">${pasado ? pesos(x.sobra) : ''}</span></div>`;
  }).join('');
  return tarjetaObjetivo(c) + graficoDias(c) + '<div class="card"><h2>Día por día</h2><div class="mut" style="margin:-4px 0 8px">Tocá un día para ver sus gastos.</div>' +
    '<div class="tb mut"><span>Día</span><span>Presupuesto</span><span>Gasto</span><span>Sobrante</span></div>' + filas +
    '<div style="margin-top:8px">' + filaDoble('Total gastado', pesos(suma(S.spent.filter(e => !e.meta), e => e.amt))) +
    filaDoble(`Queda del monto disponible ${botonOjo()}`, dinero(c.saldo)) +
    (c.fondo.activo ? filaDoble('Ahorrado en el fondo este período', dinero(c.fondo.ahorroPeriodo)) : '') + '</div></div>';
}

function ventanaDia(iso) {
  const gastos = S.spent.filter(e => e.date === iso).sort((a, b) => a.id - b.id);
  const cierre = (S.cierres || {})[iso], dia = diasDelPeriodo(S, hoyISO()).find(x => x.iso === iso);
  const total = suma(gastos.filter(e => !e.meta), e => e.amt);
  const m = crearModal(
    `<div class="row" style="border:0"><b style="font-size:17px">${dia ? dia.dia : ''} ${diaYMes(iso)}</b><button class="x" id="dx">✕</button></div>` +
    (dia ? `<div class="mut" style="margin-bottom:6px">Presupuesto del día ${pesos(dia.presupuesto)}</div>` : '') +
    (cierre ? `<div class="mut" style="margin-bottom:6px">🔒 Cerrado: gastado ${pesos(cierre.g)}, sobrante ${pesos(cierre.l)}${Math.abs(cierre.g - total) > 0.5 ? ' <b class="neg">· cambió después del cierre</b>' : ''}</div>` : '') +
    (gastos.length
      ? gastos.map(e => `<div class="row"><span>${emojiCategoria(e.cat)}${escapar(e.note || e.cat || 'Sin detalle')}</span><span><b>${pesos(e.amt)}</b><button class="x" data-ed="${e.id}">✎</button></span></div>`).join('') + filaDoble('Total del día', pesos(total))
      : '<div class="mut" style="margin:10px 0">No hay gastos anotados este día.</div>'),
    380, 20, 'max-height:80vh;overflow:auto');
  m.onclick = ev => {
    const id = ev.target.dataset.ed;
    if (ev.target === m || ev.target.id === 'dx') m.remove();
    if (id) { m.remove(); UI.editando = +id; UI.pestana = 'hoy'; dibujar(); scrollTo(0, 0); }
  };
}

/* ------------------------------ PLAN: ingresos, gastos importantes, cuotas y metas ------------------------------ */
function pantallaPlan(c) {
  const resumen = '<div class="card"><h2>Resumen del mes</h2>' + filaDoble('Total de ingresos', dinero(totalIngresos(S))) +
    filaDoble('Total gastos importantes', pesos(c.total)) + filaDoble('Todavía por pagar', pesos(c.porPagar)) +
    filaDoble(`Disponible del mes ${botonOjo()}`, dinero(c.disp)) + filaDoble(`Base por día (${c.dias} días)`, pesos(c.base)) + '</div>';
  return tarjetaIngresos(false) + tarjetaGastosImportantes() + tarjetaProximos() + tarjetaCuotas() + resumen + tarjetaMetas();
}

function tarjetaIngresos(intro) {
  const tipo = intro ? 'text' : campoDinero();
  const opciones = x => (CATEGORIAS_INGRESO.includes(x.cat) ? CATEGORIAS_INGRESO : CATEGORIAS_INGRESO.concat(x.cat))
    .map(cat => `<option${cat === x.cat ? ' selected' : ''}>${escapar(cat)}</option>`).join('');
  const filas = (S.ingresos || []).map((x, k) =>
    `<div class="f"><select data-f="ingresoCategoria" data-k="${k}">${opciones(x)}</select>` +
    `<input type="${tipo}" inputmode="decimal" data-f="ingresoMonto" data-k="${k}" value="${x.a || ''}" placeholder="Monto" style="max-width:130px">` +
    `<button class="x" data-a="quitarIngreso" data-i="${k}">✕</button></div>`).join('');
  return '<div class="card">' + (intro ? '' : '<h2>💵 Ingresos</h2><div class="mut" style="margin-bottom:8px">De dónde viene tu plata cada mes.</div>') + filas +
    '<button class="sec" data-a="agregarIngreso">Agregar ingreso</button><div style="margin-top:10px">' +
    filaDoble('Total de ingresos', intro ? pesos(totalIngresos(S)) : dinero(totalIngresos(S))) + '</div></div>';
}

function tarjetaGastosImportantes() {
  const lista = S.items.map((i, k) =>
    `<div class="f"><input type="checkbox" data-f="itemPagado" data-k="${k}" ${i.p ? 'checked' : ''}>` +
    `<input data-f="itemNombre" data-k="${k}" value="${escapar(i.n)}" placeholder="Nombre">` +
    `<input data-f="itemMonto" data-k="${k}" inputmode="decimal" value="${i.a || ''}" placeholder="Monto" style="max-width:110px">` +
    `<button class="x" data-a="quitarGasto" data-i="${k}">✕</button></div>` +
    (i.d ? `<div class="mut" style="font-size:12px;margin:-4px 0 8px 32px">Se descuenta desde el ${diaYMes(i.d)}</div>` : '') +
    (i.x || []).map(x => `<div class="mut" style="font-size:12px;margin:-4px 0 8px 32px">Aumento de ${dineroOculto() ? '••••' : pesos(x.amt)} desde el ${diaYMes(x.desde)}</div>`).join('') +
    ((i.n || i.a) && !tieneCuotas(i) ? `<div class="f" style="margin:-4px 0 6px 32px;flex-wrap:wrap;gap:4px 14px">` +
      `<label class="mut" style="margin:0;font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" data-f="itemRepite" data-k="${k}" ${i.f !== false ? 'checked' : ''}>🔁 Repetir el mes que viene</label>` +
      (i.f !== false ? `<label class="mut" style="margin:0;font-size:13px;display:flex;align-items:center;gap:6px"><input type="checkbox" data-f="itemVariable" data-k="${k}" ${i.v ? 'checked' : ''}>✏️ El monto cambia (queda vacío)</label>` : '') +
      `</div>` : '') + lineaDeCuotas(i, k)).join('');
  return '<div class="card"><h2>🧾 Pagar al cobrar</h2><div class="mut" style="margin-bottom:8px">Lo primero que se paga cuando cobrás. Tildá 🔁 en los fijos de todos los meses; si el monto cambia (luz, gas), tildá también ✏️ y el mes que viene aparecen con el monto vacío.</div>' + lista +
    '<button class="sec" data-a="agregarGasto">Agregar gasto</button></div>';
}

/* Gastos del próximo período: se anotan ahora pero NO descuentan nada de este; al empezar el período nuevo pasan a "Pagar al cobrar" */
function tarjetaProximos() {
  const l = S.proximos || [];
  const lista = l.map((x, k) =>
    `<div class="f"><input data-f="proxNombre" data-k="${k}" value="${escapar(x.n)}" placeholder="Nombre">` +
    `<input data-f="proxMonto" data-k="${k}" inputmode="decimal" value="${x.a || ''}" placeholder="Monto" style="max-width:110px">` +
    `<button class="x" data-a="quitarProximo" data-i="${k}">✕</button></div>`).join('');
  return '<div class="card"><h2>🗓️ Para el próximo período</h2><div class="mut" style="margin-bottom:8px">Anotá ya los gastos que sabés que vas a tener cuando cobres. No descuentan nada de este período; cuando empieces el nuevo pasan solos a "Pagar al cobrar".</div>' + lista +
    (l.length ? `<div style="margin:4px 0 8px">${filaDoble('Ya reservado para el próximo', pesos(suma(l, x => +x.a || 0)))}</div>` : '') +
    '<button class="sec" data-a="agregarProximo">Agregar gasto del próximo período</button></div>';
}

/* Debajo de cada gasto: o los datos de la cuota (5 de 12) o el botón para marcarlo en cuotas */
function lineaDeCuotas(i, k) {
  if (tieneCuotas(i))
    return `<div class="f" style="margin:-4px 0 10px 32px;flex-wrap:wrap"><span class="mut">Cuota</span>` +
      `<input data-f="cuotaActual" data-k="${k}" inputmode="numeric" value="${i.q.actual}" style="max-width:64px"><span class="mut">de</span>` +
      `<input data-f="cuotaTotal" data-k="${k}" inputmode="numeric" value="${i.q.total}" style="max-width:64px">` +
      `<button class="x" data-a="quitarCuotas" data-i="${k}">Pago único</button></div>`;
  return (i.n || i.a) ? `<div style="margin:-4px 0 6px 32px"><button class="x" data-a="ponerCuotas" data-i="${k}" style="padding:2px 6px;font-size:13px">+ Es en cuotas</button></div>` : '';
}

function tarjetaCuotas() {
  const cuotas = resumenCuotas(S);
  if (!cuotas.length) return '<div class="card"><h2>📆 Cuotas</h2><div class="mut">Si un gasto se paga en cuotas, por ejemplo la tarjeta, tocá "+ Es en cuotas" debajo de ese gasto y poné en cuál vas (5 de 12). Al empezar cada período, la app pasa a la cuota siguiente.</div></div>';
  return '<div class="card"><h2>📆 Cuotas en curso</h2>' +
    cuotas.map(q => filaDoble(`${escapar(q.n || 'Sin nombre')} · cuota ${q.actual}/${q.total}`, q.restantes ? `faltan ${q.restantes} (${pesos(q.restoTotal)})` : '¡última cuota!')).join('') +
    '<div style="margin-top:6px">' + filaDoble('Falta pagar en cuotas (sin la de este mes)', pesos(suma(cuotas, q => q.restoTotal))) + '</div></div>';
}

/* ------------------------------ INTRODUCCIÓN (primera vez) ------------------------------ */
/* Barra de avance de la introducción: 6 pantallas (la bienvenida es la primera) */
function progresoIntro(n) {
  const puntos = [0, 1, 2, 3, 4, 5].map(i => `<span class="${i < n ? 'hecho' : i === n ? 'actual' : ''}"></span>`).join('');
  return `<div class="progreso"><div class="puntos">${puntos}</div><div class="mut">Paso ${n + 1} de 6</div></div>`;
}
function pantallaBienvenida() { return (UI.paso >= 1 ? progresoIntro(UI.paso) : '') + contenidoBienvenida(); }

function contenidoBienvenida() {
  const c = calcular(S, hoyISO()), nombre = nombreUsuario(), paso = UI.paso;
  const pie = (conAtras, texto) => '<div class="pie">' + (conAtras ? '<button class="sec" data-a="pasoAtras">← Atrás</button>' : '<span></span>') +
    `<button data-a="pasoSiguiente">${texto}</button></div>`;
  const titulo = (grande, chico) => `<div style="margin:6px 2px 16px"><div class="serif" style="font-size:28px;font-weight:800;line-height:1.15">${grande}</div><div class="mut" style="margin-top:6px">${chico}</div></div>`;

  /* 0 · Bienvenida: una pantalla aparte, solo para dar la bienvenida */
  if (paso === 0)
    return `<div class="hero"><div class="moneda">💰</div><div class="serif hero-t">Bienvenido${nombre ? ',<br>' + escapar(nombre) : ''}</div>` +
      '<div class="serif hero-s">a Mi plata</div><p class="hero-p">Ordená tu plata, un día a la vez.</p>' +
      `<input data-f="nombre" value="${escapar(nombre)}" placeholder="¿Cómo te llamás? (opcional)"${S.demo ? ' readonly autocomplete="off"' : ''} style="max-width:320px;text-align:center">` +
      (S.demo ? '' : '<div class="importar"><div class="importar-fila"><span class="importar-icono">📥</span><span class="importar-txt"><b>¿Ya usabas Mi plata?</b><span>Traé tus datos desde una copia de seguridad.</span></span></div>' +
      '<button class="sec" data-a="recuperarNube" style="width:100%;margin-top:12px;background:var(--card)">Importar copia de seguridad</button>' +
      '<input id="fi" type="file" accept=".json,.txt,application/json,text/plain" style="display:none"></div>') +
      pieCopyright() + '</div>' + pie(false, S.demo ? 'Continuar →' : 'Comenzar →');

  /* 1 · Cómo funciona, con un ejemplo con números */
  if (paso === 1)
    return titulo('Así funciona', 'Tres pasos y listo.') + '<div class="card">' +
      [['1', 'Cargás lo que cobrás.'], ['2', 'Anotás lo que pagás sí o sí: alquiler, servicios, tarjetas.'], ['3', 'Lo que sobra se divide entre los días del mes.']]
        .map(([n, t]) => `<div class="f" style="align-items:flex-start"><span class="paso">${n}</span><span>${t}</span></div>`).join('') + '</div>' +
      '<div class="card"><div class="mut" style="margin-bottom:6px">Un ejemplo</div>' + filaDoble('Cobrás', pesos(1000000)) + filaDoble('Pagás sí o sí', '− ' + pesos(400000)) +
      filaDoble('Te quedan para 30 días', pesos(600000)) + `<div class="resultado">${pesos(20000)}<span> por día</span></div></div>` +
      '<div class="mut">Si hoy gastás menos, <b>lo que sobra pasa a mañana</b>. Si te pasás, mañana tenés un poco menos.</div>' +
      '<div class="mut" style="margin-top:10px;font-size:13px">Además: metas de ahorro, cuotas, PIN, copias de seguridad y un resumen para compartir.</div>' +
      pieCopyright() + pie(true, 'Siguiente →');

  /* 2 · Confianza: qué pasa con los datos */
  if (paso === 2) {
    const puntos = CONFIG.nube
      ? ['Sin anuncios.', 'Tus datos se guardan en tu cuenta de Claude: nadie más los ve.', 'Podés ponerle PIN a la app.', 'Podés guardar una copia cuando quieras.']
      : ['Sin cuenta ni registro.', 'Sin anuncios.', 'Tus números se guardan en tu teléfono y solo salen si vos guardás una copia.',
         'No pide acceso a tus contactos, ubicación ni cámara. El micrófono solo se usa si tocás Dictar.', 'Podés ponerle PIN para que nadie vea tus números.', 'Las copias las guardás vos, en tu Drive.'];
    return titulo('Tu plata, tu decisión', 'Lo que tenés que saber antes de empezar.') + '<div class="card">' +
      puntos.map(t => `<div class="f" style="align-items:flex-start"><span style="color:var(--ok);font-weight:700">✓</span><span>${t}</span></div>`).join('') + '</div>' +
      (CONFIG.apk ? '<div class="mut" style="font-size:13px">Podés comprobar los permisos en Ajustes de Android → Apps → Mi plata → Permisos.</div>' : '') +
      pieCopyright() + pie(true, 'Siguiente →');
  }

  /* 3 · Hoja en blanco para los ingresos */
  if (paso === 3)
    return titulo('¿De dónde viene tu plata?', 'Elegí la categoría de cada ingreso y escribí cuánto es.') + tarjetaIngresos(true) +
      `<div class="card"><h2>📅 ¿Cuándo cobrás?</h2><label style="margin-top:0">Día que cobrás (inicio del mes)</label><input type="date" data-f="inicio" value="${S.start}">` +
      `<label>Próximo cobro (fin)</label><input type="date" data-f="fin" value="${S.end}"></div>` +
      pieCopyright() + pie(true, 'Siguiente →');

  /* 4 · Gastos importantes */
  if (paso === 4)
    return titulo('Tus gastos importantes', 'Lo primero que pagás al cobrar: alquiler, servicios, tarjetas, cuotas.') +
      tarjetaGastosImportantes() + tarjetaCuotas() +
      `<div class="card"><label style="margin-top:0">Saldo previo en cuenta (opcional)</label><input data-f="previo" inputmode="decimal" value="${S.previo || ''}" placeholder="Lo que te quedó del mes anterior"></div>` +
      '<div class="card"><h2>Así queda tu mes</h2>' + filaDoble('Ingresos', pesos(totalIngresos(S))) + filaDoble('Gastos importantes', pesos(c.total)) +
      filaDoble('Te queda para el día a día', pesos(c.disp)) + '</div>' +
      pieCopyright() + pie(true, 'Siguiente →');

  /* 5 · Listo: el resultado, en grande */
  const porDia = c.dias ? c.disp / c.dias : 0;
  return `<div class="hero"><div class="moneda">🎉</div><div class="serif" style="font-size:30px;font-weight:800;line-height:1.15;margin-top:10px">Listo${nombre ? ', ' + escapar(nombre) : ''}.<br>Tu plan está armado.</div>` +
    (porDia > 0
      ? `<div class="mut" style="margin-top:26px">Podés gastar unos</div><div class="grande">${pesos(porDia)}</div><div class="mut">por día durante ${c.dias} días</div>` +
        '<p class="hero-p" style="margin-top:18px">Lo que no gastes hoy, pasa a mañana.</p>'
      : '<p class="hero-p" style="margin-top:18px">Tus gastos importantes superan lo que cobrás. Volvé atrás y revisá los montos.</p>') +
    pieCopyright() + '</div>' + pie(true, 'Empezar →');
}

function tarjetaMetas() {
  const hoy = hoyISO();
  const metas = metasDe().map((m, k) => {
    const juntado = juntadoEnMeta(S, m), pct = m.t > 0 ? Math.min(100, juntado / m.t * 100) : 0;
    const sugerido = aporteMensualSugerido(S, m, hoy);
    return `<div style="margin-bottom:18px"><div class="f"><input data-f="metaNombre" data-k="${k}" value="${escapar(m.n)}" placeholder="Nombre de la meta"><button class="x" data-a="quitarMeta" data-i="${k}">✕</button></div>` +
      `<div class="bar"><i style="width:${pct}%"></i></div><div class="mut" style="font-size:16px">Juntado <b>${pesos(juntado)}</b> de <b>${pesos(m.t)}</b> (${Math.round(pct)}%)</div>` +
      `<div class="mut">Falta <b>${pesos(Math.max(0, m.t - juntado))}</b></div>` +
      `<label>Cuánto necesitás juntar</label><input inputmode="decimal" data-f="metaObjetivo" data-k="${k}" value="${m.t || ''}">` +
      `<label>Ya juntado antes</label><input inputmode="decimal" data-f="metaPrevio" data-k="${k}" value="${m.g0 || ''}">` +
      `<label>Fecha objetivo (opcional)</label><input type="date" data-f="metaFecha" data-k="${k}" value="${m.f || ''}">` +
      `<div class="mut" style="margin:8px 0">${sugerido ? `Para llegar a esa fecha, juntá unos <b>${pesos(sugerido)}</b> por mes.` : 'Poné una fecha y te digo cuánto juntar por mes.'}</div>` +
      `<div class="f"><input id="ap${m.id}" inputmode="decimal" placeholder="Monto a aportar" value="${sugerido || ''}"><button data-a="aportar" data-i="${k}">Aportar</button></div></div>`;
  }).join('');
  return '<div class="card"><h2>🎯 Metas</h2>' + metas + '<button class="sec" data-a="agregarMeta">Agregar meta</button>' +
    '<div class="mut" style="font-size:13px;margin-top:8px">Lo que aportás sale de tu plata disponible, igual que un gasto importante, y baja la base por día de forma pareja.</div></div>';
}

/* ------------------------------ CLAUDE ------------------------------ */
function pantallaClaude() {

    `<div class="f" style="flex-wrap:wrap">${sugerencias.map(t => `<button class="sec" data-a="sugerencia" data-q="${t}">${t}</button>`).join('')}</div></div>` +
    `<div class="card" id="ans" style="white-space:pre-wrap">${UI.respuestaIA ? escapar(UI.respuestaIA) : '<span class="mut">La respuesta aparece acá.</span>'}</div>`;

/* ------------------------------ AJUSTES ------------------------------ */
function pantallaAjustes(c) {

    tarjetaAcercaDe(),
    S.demo ? '' : tarjetaDemo(),
    S.demo ? '' : '<div class="card"><h2>Empezar de cero</h2><button class="sec" data-a="borrarTodo">Borrar todo</button></div>'].join('');

    '<div class="mut" style="margin-bottom:10px">Estás viendo datos de ejemplo. Lo que anotes acá se descarta al salir. Tus datos reales están guardados aparte y vuelven cuando salís.</div>' +

    `<label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin:8px 0"><input type="checkbox" data-f="demoFrases" ${S.demoFrases === false ? '' : 'checked'}>Mostrar frases en pantalla</label>` +
    '<div class="f" style="flex-wrap:wrap"><button data-a="reproducirDemo">▶️ Reproducir demo</button><button class="sec" data-a="salirDemo">Salir y volver a mis datos</button></div></div>';
  return '<div class="card"><h2>🎬 Modo demo</h2>' +

    '<div style="margin:10px 0">Hecha por <b>' + AUTOR + '</b>. ¿Dudas, ideas o algo que no anda? Escribime.</div>' +
    '<div class="f" style="flex-wrap:wrap">' +
    '<a class="bt wa" href="https://wa.me/' + AUTOR_WA + '" target="_blank" rel="noopener">' + iconoWhatsApp + 'WhatsApp</a>' +
    '<a class="bt" href="mailto:' + AUTOR_EMAIL + '">✉️ ' + AUTOR_EMAIL + '</a></div>' +
    pieCopyright() + '</div>';
}

function tarjetaPin() {
  if (!S.pin) return '<div class="card"><h2>PIN de seguridad</h2><div class="mut" style="margin-bottom:8px">Protegé tus números con un PIN de 4 a 8 números.</div>' +

function ventanaResumen() {
  const hoy = hoyISO(), c = calcular(S, hoy);
  const fecha = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
  let texto = '💰 Mi plata · ' + fecha + '\nPresupuesto de hoy: ' + pesos(c.quedaHoy + c.gastoHoy) + '\nGasté hoy: ' + pesos(c.gastoHoy) + '\nMe queda para hoy: ' + pesos(c.quedaHoy);
  if (c.manana != null) texto += '\nMañana tendré: ' + pesos(c.manana);
  if (c.fondo.activo) texto += '\n🏦 Mi fondo de ahorro: ' + pesos(c.fondo.total);
  texto += '\nDías hasta el próximo cobro: ' + c.faltan;
  metasDe().filter(m => m.t > 0).forEach(m => { texto += '\n🎯 ' + m.n + ': ' + Math.round(juntadoEnMeta(S, m) / m.t * 100) + '% juntado'; });
  texto += '\n\n“' + fraseDelDia(hoy) + '”';
  const v = crearModal('<div style="font-weight:700;margin-bottom:6px">Resumen para compartir</div><div class="mut" style="font-size:13px">Podés editar el texto antes de enviarlo.</div>' +
    '<textarea id="rt" rows="9"></textarea><div class="f" style="margin-top:10px;flex-wrap:wrap"><a class="bt" id="rw" target="_blank" rel="noopener">WhatsApp</a>' +
    '<button class="sec" id="rc">Copiar</button><button class="sec" id="rx">Cerrar</button></div>', 380);
  const caja = v.querySelector('#rt'), enlace = v.querySelector('#rw');
  caja.value = texto;
  const actualizar = () => { enlace.href = 'https://wa.me/?text=' + encodeURIComponent(caja.value); };
  caja.oninput = actualizar; actualizar();
  v.querySelector('#rc').onclick = () => { caja.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} aviso(ok ? 'Copiado.' : 'Mantené apretado el texto para copiarlo.'); };
  v.querySelector('#rx').onclick = () => v.remove();
}
